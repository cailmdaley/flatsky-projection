# The 2021 configuration, reproduced exactly. This is the regression universe:
# anything that does not reproduce the surviving 2021 bandpowers under it
# (/sptlocal/analysis/pol_project2020/results/spectra) is a migration bug, not a
# new result.
id: baseline
description: >
  The 2021 configuration: Nside 8192 inputs through an Nside 4096 intermediate
  grid, lmax 4000, bilinear interpolation oversampled 8x, C2 apodization at 2.5
  degrees, B-mode purification on, no pixel window correction.
decisions:
  intermediate_nside: nside4096
  ell_max: l4000
  interpolation: interp_rebin8
  apodization: c2_2p5deg
  b_purification: purify
  pixel_window: none
  bandpower_width: d10
