# Apodization variant: same kernel scale, gentler taper.
#
# Gil's "mask corners" suspicion for the high-ell excess is a claim about the
# mask edge, and the mask edge is set by two things that the 2021 run never
# separated: the kernel SHAPE and the taper WIDTH. This universe holds the
# width at 2.5 degrees and swaps C2 for C1, so any change it produces is
# attributable to the kernel alone. Its sibling apod_wide holds the kernel and
# widens the taper.
#
# Everything else is baseline, so this is a controlled single-decision variant
# of the regression universe rather than a new configuration.
id: apod_c1
description: >
  Baseline in every respect except the mask apodization kernel: C1 at 2.5
  degrees instead of C2. Isolates the apodization kernel's shape from its
  scale as a contributor to edge-driven leakage.
decisions:
  intermediate_nside: nside4096
  ell_max: l4000
  interpolation: interp_rebin8
  apodization: c1_2p5deg
  b_purification: purify
  pixel_window: none
  bandpower_width: d10
