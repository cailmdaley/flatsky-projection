# The revival universe, aimed at the collaboration's open question. Expensive:
# the coupling-matrix build grows steeply with lmax and the intermediate grid is
# four times larger. Do not run it until baseline reproduces 2021.
id: highell
description: >
  Pushes past where the 2021 analysis can speak: lmax 6000 on an Nside 8192
  intermediate grid, so the harmonic range covers the SFL excess seen near
  ell 4500 and the intermediate grid stays lossless there. Both pixel windows are
  divided out so a resolution artefact and a projection artefact are no longer
  degenerate.
decisions:
  intermediate_nside: nside8192
  ell_max: l6000
  interpolation: interp_rebin8
  apodization: c2_2p5deg
  b_purification: purify
  pixel_window: healpix_and_flat
