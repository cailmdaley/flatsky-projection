version: "0.0.13"
id: pol_projection
name: "Polarization projection — mainline OSPool proof"
inputs:
  - id: spt3g_build
    type: data
    source: data/spt3g_build.tar.gz
outputs:
  - id: healpix_masks
    type: data
    format: tar
    inputs: [spt3g_build]
    decisions: [intermediate_nside, apodization]
    recipe:
      command: >-
        cp {inputs.spt3g_build} spt3g_build.tar.gz &&
        bash env.sh python3 src/stages/make_masks.py
        --nside {decisions.intermediate_nside}
        --apodization {decisions.apodization}
        --ra-deg 0 --dec-deg -56
        --radii-rad 0.175 0.2 0.225 0.25 0.35 0.45 0.65
        --max-procs 1 --out masks &&
        tar -cf {output} -C masks .
      resources:
        cpus: 1
        memory: 12Gi

decisions:
  intermediate_nside:
    label: Intermediate Healpix resolution
    default: nside4096
    options:
      nside4096: {label: Nside 4096}
  apodization:
    label: Spherical apodization
    default: c2_2p5deg
    options:
      c2_2p5deg: {label: C2 at 2.5 degrees}
