# ASTRA specification: flat-sky projection effects on CMB spectra.
#
# EXECUTION. Recipes run on the host, with no container, through the launcher
# env.sh at the repo root. On amundsen it defers to the SPT-3G build's
# env-shell.sh; on an Open Science Pool worker, where /home does not exist, it
# unpacks the shipped spt3g_build.tar.gz and activates the CVMFS py3-v5
# toolset (pymaster 2.0, healpy 1.16.6). The same command therefore runs
# locally and under `lc run --executor htcondor --profile htcondor9`.
# env-shell.sh word-splits quoted arguments, so recipes pass scripts by path,
# never `python -c "..."`.
#
# MEMORY. amundsen caps memory at 60 GiB per UNIX user, shared by every process
# the account runs. An over-cap process is SIGKILLed with no traceback and an
# empty log; `dmesg -T | grep oom` is the only evidence. The `memory:` figures
# below are grid requests, not a budget enforced locally.
#
# CODE IS NOT AN INPUT. No script is declared as an input, so editing a script
# does not mark its outputs stale. After a change that alters results, rerun
# the affected outputs by hand (`lc run --force <output>`).
#
# Each recipe passes every input it reads as {inputs.x} and every decision it
# uses as {decisions.x}. A value written literally in a recipe is a deliberate
# choice for that output, and its description says what the value is and why.

version: "0.0.12"
id: pol_projection
name: "Closed-form distortion of projected flat-sky CMB spectra"

description: |
  A flat-sky analysis projects a patch of the sphere onto a plane, and near
  every point the projection rotates, magnifies and shears the field by
  amounts fixed in closed form by its Jacobian. Polarization pipelines remove
  the rotation ("flattening"). The shear remains: it averages each power
  spectrum over a band of multipoles, as lensing does, and it turns the E/B
  basis so that a fraction 2<g^2> of EE appears as BB, <g^2> being the mean
  squared shear under the squared mask. This analysis measures both effects
  on simulations and tests a forward model built from the local geometry.

  The pipeline has no data inputs. CAMB spectra of the cosmology decision
  set the input power, and one unlensed Gaussian sky is drawn per seed with
  B = 0, so every recovered BB bandpower is leakage. Each sky is
  band-limited at ell_max, synthesized on an intermediate HEALPix grid, and
  projected by bilinear interpolation with oversampling onto a 4500 x 4500
  grid of 2 arcmin pixels centred on (RA, dec) = (0, -56 deg), in the
  stereographic (STG), Lambert zenithal equal-area (ZEA), BICEP-style
  equidistant cylindrical (BICEP) and Sanson-Flamsteed (SFL) projections.
  Three legs pass each sky through the pipeline: the Q/U leg projects Q and
  U, flattens them by the polar-decomposition angle of the Jacobian and
  decomposes into E and B on the plane, as a real analysis does; the E/B
  leg decomposes on the sphere and projects E and B as scalars, so it
  cannot leak; the T leg projects temperature as a scalar. Twenty
  white-spectrum skies also pass through the T leg, to test the coupling
  matrix on a spectrum other than the CMB's.

  Spectra are NaMaster flat-sky bandpowers, with B-mode purification on the
  spin-two field, of width 50 up to ell_max 6000, divided by the 2 arcmin
  flat-sky pixel window. Seven RA/dec rectangles share one C2 2.5 deg
  apodization: SPT's 1500d field, the reference, and six self-similar
  rectangles about the same centre, together 0.77% to 10.06% of the sky.

  Two field suites support the bandpower-covariance and inversion results:
  260 independent skies through the 1500d field pipeline with 256
  homogeneous controls, and 260 noisy SPT-3G-like lensed skies.

tags: [cmb, polarization, b-modes, flat-sky, projection, spt-3g, namaster]

inputs: []

# ---------------------------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------------------------
outputs:
  # --- The main chain: theory, alms, maps, masks, couplings, bandpowers -----
  - id: theory_spectra
    type: data
    label: "CAMB theory spectra"
    description: |
      Lensed and unlensed TT, EE, BB and TE from CAMB 1.5.4 in the cosmology
      decision's parameters (lens_potential_accuracy 2, no tensors), as raw
      C_ell in uK^2 indexed by multipole from ell = 0 to 10000, in
      theory_spectra.npz with the run's parameters in a pickled `header`. The
      skies are drawn from its unlensed spectra, and every comparison with
      theory in the paper reads it.
    decisions: [cosmology]
    recipe:
      command: >-
        bash env.sh python3 src/stages/theory_spectra.py
        --cosmology {decisions.cosmology} --out {output}
      resources:
        cpus: 1
        memory: 2Gi
        disk: 1Gi
        time_limit: 1h

  - id: sky_alms
    type: data
    label: "Gaussian CMB skies"
    description: |
      T, E and B spherical-harmonic coefficients of one unlensed Gaussian sky
      per seed, drawn with healpy.synalm from the unlensed TT, EE and TE of
      theory_spectra with BB = 0 and band-limited at ell_max. B is
      identically zero, so every recovered BB bandpower is leakage. Every
      projection leg of a seed starts from these same alms, so the legs
      differ by projection alone.
    inputs: [theory_spectra]
    decisions: [ell_max]
    units:
      seed: 0..20
    recipe:
      command: >-
        bash env.sh python3 src/stages/sky_alms.py --spectrum cmb
        --theory {inputs.theory_spectra}
        --lmax {decisions.ell_max} --seeds {units.seed}
        --max-procs 2 --out {output}
      resources:
        cpus: 2
        # synalm and the write at ell_max 6000: 52 s and 3.2 GB peak; the
        # alms file is 1.1 GB.
        memory: 6Gi
        disk: 3Gi
        time_limit: 1h

  - id: healpix_masks
    type: data
    label: "Apodized HEALPix footprint masks"
    description: |
      One apodized mask per footprint, built on the intermediate HEALPix grid
      the maps are synthesized onto, so mask and map share a pixelization
      before projection. The footprints are seven RA/dec rectangles centred
      on (0, -56 deg), self-similar to SPT's 1500d field (RA -50 to +50 deg,
      dec -70 to -42 deg), which is the member of scale 1: scale s gives RA
      half-width 50 s and dec half-width 14 s deg, for s from 0.45 to 1.65,
      0.77% to 10.06% of the sky (src/stages/_footprints.py). They are the
      sky-fraction sweep of the paper. The taper is NaMaster's C1 or C2 kernel
      evaluated at each pixel's exact geodesic distance to the boundary. The
      index records each mask's realized sky fraction at three weightings
      (binary, W, W^2).
    decisions: [intermediate_nside, apodization]
    units:
      footprint: [rect_0p77, rect_1p36, rect_2p12, field_1500d, rect_5p84, rect_7p81, rect_10p06]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/make_masks.py
        --nside {decisions.intermediate_nside}
        --apodization {decisions.apodization}
        --footprint {units.footprint}
        --max-procs 2
        --out {output}
      resources:
        cpus: 2
        # One dense Nside-8192 float64 map (6.4 GB) plus the footprint's
        # pixel vectors: 7.2 GB peak and 17 s for rect_0p77, 9.2 GB and 70 s
        # for rect_10p06.
        memory: 16Gi
        # Masks are written ring-sparse and gzipped, tens of MB each.
        disk: 8Gi
        time_limit: 1h

  - id: projected_qu
    type: data
    label: "Projected Q/U maps (Q/U leg)"
    description: |
      Q and U synthesized from the alms on the intermediate HEALPix grid,
      projected onto the 4500 x 4500, 2 arcmin flat-sky grid centred on
      (0, -56 deg) in each of the four projections, then flattened by the
      flattening decision. This is the leg a real flat-sky polarization
      analysis produces, and the leg that carries the E-to-B leakage the
      paper measures.
    inputs: [sky_alms]
    decisions: [interpolation, intermediate_nside, flattening]
    units:
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/project_qu.py
        --alms {inputs.sky_alms}
        --projections {units.projection}
        --interpolation {decisions.interpolation}
        --flattening {decisions.flattening}
        --nside {decisions.intermediate_nside}
        --seeds {units.seed}
        --max-procs 4
        --out {output}
      resources:
        cpus: 4
        # 19.1 GB peak at Nside 8192 (/usr/bin/time -v); about 3 min of
        # synthesis plus 11 min per projection on the 4500 grid, 30 s of it
        # the polar flattening angle. Each map file is 324 MB. condor's
        # sampled MemoryUsage underreports the peak 2-3x.
        memory: 24Gi
        disk: 8Gi
        time_limit: 2h

  - id: projected_eb
    type: data
    label: "Projected E/B maps (E/B leg)"
    description: |
      E and B synthesized on the sphere from the same alms, on the same
      intermediate grid, and projected as spin-zero scalars. No spin-two
      basis is ever projected, so this leg has no projection-induced E-to-B
      mixing: it is the leakage-free reference for the Q/U leg.
    inputs: [sky_alms]
    decisions: [interpolation, intermediate_nside]
    units:
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/project_eb.py
        --alms {inputs.sky_alms}
        --projections {units.projection}
        --interpolation {decisions.interpolation}
        --nside {decisions.intermediate_nside}
        --seeds {units.seed}
        --max-procs 4
        --out {output}
      resources:
        cpus: 4
        # 19.1 GB peak, about 3 + 11 min wall per unit; 162 MB per file.
        memory: 24Gi
        disk: 8Gi
        time_limit: 2h

  - id: flatsky_masks
    type: data
    label: "Flat-sky footprint masks"
    description: |
      Each footprint's HEALPix mask projected into each of the four
      projections with the maps' interpolation, then cut to the window
      NaMaster analyses; the window sets the flat-sky Fourier grid and so the
      bandpowers. Each footprint's window is the tightest even-sided
      rectangle around its support in each projection, two to three times
      wider than tall, since a square would multiply the coupling-matrix
      cost. On the 4500-pixel grid every support, taper included, keeps a
      margin to the grid's edge: at least 172 pixels (5.7 deg), for the
      largest rectangle in SFL.
    inputs: [healpix_masks]
    decisions: [interpolation]
    units:
      footprint: [rect_0p77, rect_1p36, rect_2p12, field_1500d, rect_5p84, rect_7p81, rect_10p06]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/project_masks.py
        --healpix-masks {inputs.healpix_masks}
        --footprint {units.footprint}
        --projections ProjSFL ProjSTG ProjZEA ProjBICEP
        --interpolation {decisions.interpolation}
        --max-procs 2
        --out {output}
      resources:
        cpus: 2
        # One intermediate mask plus the 4500^2 flat outputs: 1.0-2.8 GB
        # peak and 25 min wall per footprint for the four projections. The
        # windows are 2-51 MB each.
        memory: 6Gi
        disk: 4Gi
        time_limit: 2h

  - id: coupling_matrices
    type: data
    label: "NaMaster mode-coupling workspaces"
    description: |
      Flat-sky NaMaster workspaces, spin-two with B purification (w22) and
      spin-zero (w00), one pair per projection and footprint, in bins of
      bandpower_width up to ell_max. Independent of the realizations, so every
      seed and every simulation suite on these masks reuses them.
    inputs: [flatsky_masks]
    decisions: [b_purification, ell_max, bandpower_width]
    # The build cost grows as the square of the window's pixel count: the
    # field measured 2.0 h (BICEP, 1.4 Mpx window) to 5.9 h (STG, 2.2 Mpx) on
    # 16 cores, and a 7.3 Mpx window 29-34 h on 32. The windows run from
    # 0.29 Mpx (rect_0p77, BICEP) to 6.4 Mpx (rect_10p06, STG), so by that
    # scaling the builds span 0.2 h to ~49 h on 16 cores, and the resources
    # are per unit, sized for each footprint's largest (STG) window.
    # Threading is 87-92% efficient at 8 and 32 cores. bandpowers
    # shares the projection axis, so each of its units is staged only its
    # own projection's workspaces.
    units:
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
      footprint: [rect_0p77, rect_1p36, rect_2p12, field_1500d, rect_5p84, rect_7p81, rect_10p06]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/coupling_matrices.py
        --masks {inputs.flatsky_masks}
        --projections {units.projection}
        --footprint {units.footprint}
        --purify-b {decisions.b_purification}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --max-procs {resources.cpus}
        --out {output}
      resources:
        cpus: 8
        # Peak RSS was 0.3-0.7 GB for windows up to 3 Mpx and 1.9 GB at 7.3 Mpx.
        memory: 4Gi
        disk: 4Gi
        time_limit: 2h
        # OSPool's default duration category kills at 20 h; Long at 40 h.
        extra: {classad_JobDurationCategory: Medium}
        per_unit:
          - when: {footprint: rect_1p36}
            time_limit: 4h
          - when: {footprint: rect_2p12}
            time_limit: 8h
          - when: {footprint: field_1500d}
            cpus: 16
            memory: 8Gi
            time_limit: 12h
          - when: {footprint: rect_5p84}
            cpus: 32
            memory: 8Gi
            time_limit: 16h
          - when: {footprint: rect_7p81}
            cpus: 32
            memory: 8Gi
            time_limit: 30h
            extra: {classad_JobDurationCategory: Long}
          - when: {footprint: rect_10p06}
            cpus: 32
            memory: 12Gi
            time_limit: 40h
            extra: {classad_JobDurationCategory: Long}

  - id: bandpowers
    type: data
    label: "EE and BB bandpowers of both polarization legs"
    description: |
      Decoupled NaMaster EE and BB bandpowers for every projection, footprint
      and realization, for the Q/U leg (which carries the leakage) and the
      E/B leg (the reference), divided by the pixel window the pixel_window
      decision names. Each file holds one (seed, projection) as
      ee[leg, projection, footprint, seed, bin] and the same for bb, with the
      leg, projection and footprint names stored alongside. These are the
      measured spectra of the paper and its sky-fraction sweep.
    inputs: [projected_qu, projected_eb, flatsky_masks, coupling_matrices]
    decisions: [b_purification, pixel_window, ell_max, bandpower_width]
    # One unit is one (seed, projection) over every footprint and both legs,
    # the axes shared with projected_{qu,eb}, so each grid job is staged only
    # its own ~490 MB of maps. Splitting by footprint would re-ship the same
    # maps seven times.
    units:
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/namaster_spectra.py
        --qu-maps {inputs.projected_qu}
        --eb-maps {inputs.projected_eb}
        --masks {inputs.flatsky_masks}
        --workspaces {inputs.coupling_matrices}
        --projections {units.projection}
        --seeds {units.seed}
        --purify-b {decisions.b_purification}
        --pixel-window {decisions.pixel_window}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --max-procs 2
        --out {output}
      resources:
        cpus: 2
        # condor-sampled MemoryUsage ~1 GB (underreports 2-3x); 1-6 min wall.
        memory: 16Gi
        disk: 8Gi
        time_limit: 1h

  # --- Scalar legs ----------------------------------------------------------
  - id: scalar_white_alms
    type: data
    label: "White scalar skies"
    description: |
      Independent Gaussian scalar skies with C_ell = 1 for 2 <= ell <= ell_max,
      one per seed. A spectrum with neither the CMB's slope nor its acoustic
      phase, standing in for a Poisson-source-like component: it tests
      whether a coupling matrix, or a transfer function calibrated on the
      CMB, corrects a different spectrum.
    decisions: [ell_max]
    units:
      seed: 0..20
    recipe:
      command: >-
        bash env.sh python3 src/stages/sky_alms.py --spectrum white
        --lmax {decisions.ell_max} --seeds {units.seed}
        --max-procs 2 --out {output}
      resources:
        cpus: 2
        memory: 2Gi
        disk: 2Gi
        time_limit: 1h

  - id: scalar_maps
    type: data
    label: "Projected scalar maps (T leg)"
    description: |
      Scalar skies projected exactly as the polarization maps are, in the four
      paper projections: the CMB temperature of sky_alms (spectrum tt) and
      the white skies (spectrum white).
    inputs: [sky_alms, scalar_white_alms]
    decisions: [interpolation, intermediate_nside]
    units:
      spectrum: [tt, white]
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/scalar_project.py
        --spectrum {units.spectrum}
        --tt-alms {inputs.sky_alms}
        --white-alms {inputs.scalar_white_alms}
        --projections {units.projection} --seeds {units.seed}
        --interpolation {decisions.interpolation}
        --nside {decisions.intermediate_nside}
        --max-procs 4 --out {output}
      resources:
        cpus: 4
        # 13.0 GB peak; about 1 min of synthesis plus 6 min per projection
        # on the 4500 grid; 162 MB per map.
        memory: 20Gi
        disk: 4Gi
        time_limit: 2h

  - id: scalar_bandpowers
    type: data
    label: "Scalar bandpowers (T leg)"
    description: |
      Decoupled spin-zero auto-bandpowers of the scalar maps on every
      footprint, with the polarization bins and pixel-window treatment. Each
      file holds one (spectrum, seed, projection) as cl[footprint, bin]. The
      paper's measured TT and its white-spectrum transfer test read these.
    inputs: [scalar_maps, flatsky_masks, coupling_matrices]
    decisions: [pixel_window, ell_max, bandpower_width]
    units:
      spectrum: [tt, white]
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/scalar_spectra.py
        --spectrum {units.spectrum}
        --maps {inputs.scalar_maps}
        --masks {inputs.flatsky_masks} --workspaces {inputs.coupling_matrices}
        --projections {units.projection} --seeds {units.seed}
        --pixel-window {decisions.pixel_window}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --max-procs 2 --out {output}
      resources:
        cpus: 2
        memory: 4Gi
        disk: 4Gi
        time_limit: 1h

  # --- Unit-width field spectra and the bandpower covariance ----------------
  - id: fine_pseudo_spectra
    type: data
    label: "Unit-width 1500d pseudo-spectra of the production skies"
    description: |
      Coupled TT and purified polarization pseudo-spectra (EE, EB, BE, BB) of
      the 20 production skies on the 1500d field, in unit-width annuli to
      ell_max, with the Fourier-cell count of every annulus so that any
      integer-edge rebinning before decoupling is exact. No decoupling and no
      pixel window. They supply the mean spectra the homogeneous covariance
      controls are matched to.
    inputs: [projected_qu, scalar_maps, flatsky_masks]
    decisions: [b_purification, ell_max]
    units:
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/fine_pseudo_spectra.py
        --qu-maps {inputs.projected_qu} --tt-maps {inputs.scalar_maps}
        --masks {inputs.flatsky_masks} --footprint field_1500d
        --projection {units.projection} --seed {units.seed}
        --purify-b {decisions.b_purification} --lmax {decisions.ell_max}
        --max-procs 2 --out {output}
      resources:
        cpus: 2
        memory: 8Gi
        disk: 8Gi
        time_limit: 1h

  - id: fine_coupling_matrices
    type: data
    label: "Width-five 1500d coupling workspaces"
    description: |
      Spin-zero and spin-two NaMaster workspaces on the 1500d field in bins of
      width 5, written literally in the recipe rather than taken from
      bandpower_width: the covariance analysis rebins the unit-width spectra
      to several widths (50 and 100), and a width-5 response aggregates
      exactly to any multiple of 5. Same stage and file names as
      coupling_matrices.
    inputs: [flatsky_masks]
    decisions: [b_purification, ell_max]
    units:
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/coupling_matrices.py
        --masks {inputs.flatsky_masks}
        --projections {units.projection} --footprint field_1500d
        --purify-b {decisions.b_purification}
        --lmax {decisions.ell_max} --delta-ell 5
        --max-procs {resources.cpus} --out {output}
      resources:
        cpus: 16
        memory: 16Gi
        disk: 4Gi
        time_limit: 20h
        # Medium accepts pilots with shorter remaining lifetimes than Long.
        extra: {classad_JobDurationCategory: Medium}

  - id: bin_covariance_sims
    type: data
    label: "Independent projected 1500d skies for the bandpower covariance"
    description: |
      260 independent unlensed Gaussian skies, each synthesized on the
      sphere and passed through the production field pipeline (intermediate
      grid, interpolation, flattening, field mask, pure-B estimator) for SFL,
      STG and ZEA. T and E are drawn independently and true B is zero, so the
      output tests auto-spectrum covariance, not TE or TT-EE covariance.
      Unit-width coupled pseudo-spectra only; no maps are kept. They set the
      band means and covariances the paper reports.
    inputs: [flatsky_masks, theory_spectra]
    decisions: [intermediate_nside, interpolation, b_purification, ell_max, flattening]
    units:
      seed: 0..260
    recipe:
      command: >-
        bash env.sh python3 src/stages/bin_covariance_sims.py
        --masks {inputs.flatsky_masks} --theory {inputs.theory_spectra}
        --seed {units.seed}
        --nside {decisions.intermediate_nside}
        --interpolation {decisions.interpolation}
        --flattening {decisions.flattening}
        --purify-b {decisions.b_purification} --lmax {decisions.ell_max}
        --max-procs {resources.cpus} --out {output}
      resources:
        cpus: 8
        memory: 24Gi
        disk: 4Gi
        time_limit: 4h

  - id: bin_covariance_control_spectra
    type: data
    label: "Mean spectra for the homogeneous covariance controls"
    description: |
      Mean TT, EE and BB of the 20 production field skies per projection,
      decoupled from the mask in bins of bandpower_width through the
      width-five workspaces aggregated exactly, and keeping their native
      sampling window. Used only to draw homogeneous controls with matched
      radial spectra.
    inputs: [fine_pseudo_spectra, fine_coupling_matrices]
    decisions: [ell_max, bandpower_width]
    recipe:
      command: >-
        bash env.sh python3 src/stages/bin_covariance_controls.py prepare
        --pseudos {inputs.fine_pseudo_spectra}
        --workspaces {inputs.fine_coupling_matrices}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --max-procs {resources.cpus} --out {output}
      resources:
        cpus: 2
        memory: 4Gi
        # The 1.4 GB coupling archive plus its 2.6 GB unpacked FITS.
        disk: 8Gi
        time_limit: 1h

  - id: bin_covariance_flat_controls
    type: data
    label: "Homogeneous Gaussian covariance controls"
    description: |
      256 homogeneous Gaussian flat-sky skies per projection with the matched
      radial TT, EE and BB powers, through the same field masks and the same
      pure-B unit-width estimator. They give the covariance an ordinary
      masked homogeneous sky would have, against which the projected skies'
      excess variance and band correlation are measured.
    inputs: [bin_covariance_control_spectra, flatsky_masks]
    decisions: [b_purification, ell_max]
    units:
      batch: 0..16
    recipe:
      command: >-
        bash env.sh python3 src/stages/bin_covariance_controls.py simulate
        --spectra {inputs.bin_covariance_control_spectra}
        --masks {inputs.flatsky_masks} --batch {units.batch}
        --batch-size 16
        --purify-b {decisions.b_purification} --lmax {decisions.ell_max}
        --max-procs {resources.cpus} --out {output}
      resources:
        cpus: 4
        memory: 4Gi
        disk: 4Gi
        time_limit: 1h

  # --- Inverting the response on noisy skies --------------------------------
  - id: noisy_inversion_sims
    type: data
    label: "Noisy SPT-3G-like 1500d skies"
    description: |
      260 independent lensed Gaussian skies (TT, EE, BB, TE), convolved on the
      sphere with a 1.2 arcmin Gaussian beam and passed through the
      production field projection for SFL, STG and ZEA, then observed as two
      noise splits with a coadded polarization depth of 5 uK-arcmin
      (5/sqrt(2) in temperature). The noise is white on the grid and never
      projected, at a fixed depth per unit sky area: uniform for ZEA and SFL,
      rising with STG's area magnification. The beam and depth are written
      literally in the recipe as the SPT-3G-like configuration the paper
      states. Unit-width split-cross and noise-free pseudo-spectra; no maps.
      They test the cost of inverting the response.
    inputs: [flatsky_masks, theory_spectra]
    decisions: [intermediate_nside, interpolation, b_purification, ell_max, flattening]
    units:
      seed: 0..260
    recipe:
      command: >-
        bash env.sh python3 src/stages/noisy_inversion_sims.py
        --masks {inputs.flatsky_masks} --theory {inputs.theory_spectra}
        --seed {units.seed}
        --nside {decisions.intermediate_nside}
        --interpolation {decisions.interpolation}
        --flattening {decisions.flattening}
        --purify-b {decisions.b_purification} --lmax {decisions.ell_max}
        --noise-pol 5 --beam-fwhm 1.2
        --max-procs {resources.cpus} --out {output}
      resources:
        cpus: 8
        memory: 24Gi
        disk: 4Gi
        time_limit: 6h

  # ===========================================================================
  # ANALYSIS: the letter's numbers and figures
  # ===========================================================================
  # Everything below reads the pipeline's outputs and is cheap next to it. It
  # runs with lc's default local executor, not on the grid: the survey runs
  # under uv (it needs PROJ, which the SPT environment lacks) and the paper
  # under the host's pdflatex. Every script takes each upstream output as
  # --<output-id> DIR and writes under --out; a numbers output writes
  # <id>.tex (the \newcommands paper/main.tex inputs) and <id>.json.

  # --- Geometry and the simulation's own windows ----------------------------
  - id: shear_moments
    type: data
    label: "Shear moments of every footprint"
    description: |
      The mask-squared-weighted distribution of each projection's local
      Jacobian over each footprint, evaluated on every pixel of the
      pipeline's own HEALPix masks: <g^2>, <(s1/s2 - 1)^2> and <ln^2(s1/s2)>,
      <g^2> under the |det J| and |det J|^2 weights and with a 0.5 deg polar
      cap removed, the extremes of the singular values, and a 64 x 64
      histogram in (log s1, log s2) carrying each cell's weighted centroid
      and the mean residual rotation the flattening decision leaves (zero
      under polar). The leakage law BB/EE = 2<g^2>, the forward model's
      coupling matrix and every footprint statement in the paper read the
      footprints through this one file.
    inputs: [healpix_masks]
    decisions: [flattening]
    recipe:
      command: >-
        bash env.sh python3 analysis/shear_moments.py
        --healpix-masks {inputs.healpix_masks}
        --flattening {decisions.flattening}
        --procs {resources.cpus} --out {output}
      resources:
        cpus: 3
        # One Nside-8192 footprint's pixels and Jacobians per process, in
        # 2M-pixel chunks; all seven footprints, 81 M pixels for the
        # largest: 6 min on 3 cores.
        memory: 16Gi
        disk: 1Gi
        time_limit: 2h

  - id: simulation_windows
    type: data
    label: "Simulation windows for the known input"
    description: |
      The windows the simulation itself puts on the bandpowers, relative to
      the flat-sky top-hat the pipeline already divides out: HEALPix ring
      interpolation in the sky frame and the finite-subsample rebin average
      in the map frame, integrated with the known input spectrum over the
      full local Jacobian of each footprint and projection, on the
      production bins, with the spin blocks rotated by the flattening
      decision's angle. One window per spectrum (TT, the white scalar sky,
      EE and BB on both legs), footprint and projection; set to one above
      the grid's axis Nyquist multipole, where the model does not apply.
      Every bandpower the paper quotes is divided by these. The synthesis
      Nside, pixel size and rebin factor come from the masks' index files.
    inputs: [theory_spectra, healpix_masks, flatsky_masks]
    decisions: [ell_max, bandpower_width, flattening]
    recipe:
      command: >-
        bash env.sh python3 analysis/simulation_windows.py
        --theory-spectra {inputs.theory_spectra}
        --healpix-masks {inputs.healpix_masks}
        --flatsky-masks {inputs.flatsky_masks}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --flattening {decisions.flattening}
        --procs {resources.cpus} --out {output}
      resources:
        cpus: 3
        memory: 4Gi
        disk: 1Gi
        time_limit: 1h

  - id: mask_contours
    type: data
    label: "Footprint contours on each projection's grid"
    description: |
      The W = 0.5 contours of the seven footprint masks as each projection's
      grid holds them, from the pipeline's own flat-sky masks (mean-pooled
      4 x 4 before contouring), in map-plane degrees from the grid centre,
      with the pooled image of the largest footprint. Figure 2 draws the
      largest footprint's contour.
    inputs: [flatsky_masks]
    recipe:
      command: >-
        bash env.sh python3 analysis/mask_contours.py
        --flatsky-masks {inputs.flatsky_masks} --out {output}
      resources:
        cpus: 1
        memory: 2Gi
        disk: 1Gi
        time_limit: 15m

  # --- The 1500d field and the sweep against the forward model --------------
  - id: field_spectra
    type: data
    label: "1500d-field spectra against the forward model"
    description: |
      The simulated 1500d field against the forward model, per projection:
      seed-mean EE and BB on both legs with their scatter, the binned input
      spectrum, band BB/EE over 1000 < ell < 3000 with STG's floor
      subtracted and its error, the SFL/BICEP ratio of the field's leakage
      with a delta-method error, <g^2> of the field mask, and the forward
      model's BB and EE. The field macros of `numbers` read it. Also writes a
      diagnostic figure, field_1500d.pdf, that the paper does not include.
    inputs: [bandpowers, simulation_windows, theory_spectra, shear_moments]
    recipe:
      command: >-
        bash env.sh python3 analysis/field_spectra.py
        --bandpowers {inputs.bandpowers}
        --simulation-windows {inputs.simulation_windows}
        --theory-spectra {inputs.theory_spectra}
        --shear-moments {inputs.shear_moments}
        --out {output}
      resources:
        cpus: 1
        memory: 2Gi
        disk: 1Gi
        time_limit: 15m

  - id: pipeline_windows
    type: data
    label: "Window-corrected field model and production spectra"
    description: |
      For the 1500d field, each projection and TT, the white sky, EE and BB:
      the coupling-matrix forward model of the shear moments on the
      production bins, multiplied by the ring-interpolation and rebin
      windows integrated over the full local Jacobian (spin blocks rotated
      by the flattening decision's angle), with the folded reciprocal-grid
      images normalized alike; the production bandpowers with no simulation
      window removed; and their ratios to the model. The footprint sampling
      Nside 64 and the alias images are literal recipe arguments: the
      paper's evaluation of the window integral.
    inputs: [theory_spectra, healpix_masks, flatsky_masks, shear_moments, bandpowers, scalar_bandpowers]
    decisions: [flattening]
    recipe:
      command: >-
        bash env.sh python3 analysis/report_pipeline_windows.py
        --theory-spectra {inputs.theory_spectra}
        --healpix-masks {inputs.healpix_masks}
        --flatsky-masks {inputs.flatsky_masks}
        --shear-moments {inputs.shear_moments}
        --bandpowers {inputs.bandpowers}
        --scalar-bandpowers {inputs.scalar_bandpowers}
        --flattening {decisions.flattening}
        --nside 64 --aliases --out {output}
      resources:
        cpus: 1
        # Four field coupling matrices to ell_max on the integer theory grid
        # and the alias-image response at five multipoles per band: 28 min.
        memory: 8Gi
        disk: 1Gi
        time_limit: 4h

  - id: residual_estimator_response
    type: data
    label: "Forward model through NaMaster's radial response"
    description: |
      The 1500d field's coupling-matrix model per projection, carrying the
      windows of pipeline_windows, coupled and decoupled with the production
      field workspaces: read at integer multipoles, and at k = l + 1/2, the
      spherical reference against which TT and EE are compared. The
      unbinned windowed model is evaluated to l = 8000, beyond the corner of
      the grid's Fourier plane, a choice of this output.
    inputs: [pipeline_windows, theory_spectra, shear_moments, coupling_matrices, flatsky_masks]
    decisions: [ell_max, bandpower_width]
    recipe:
      command: >-
        bash env.sh python3 analysis/residual_estimator_response.py
        --pipeline-windows {inputs.pipeline_windows}
        --theory-spectra {inputs.theory_spectra}
        --shear-moments {inputs.shear_moments}
        --coupling-matrices {inputs.coupling_matrices}
        --flatsky-masks {inputs.flatsky_masks}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --out {output}
      resources:
        cpus: 1
        memory: 6Gi
        disk: 1Gi
        time_limit: 30m

  - id: residual_summary
    type: data
    label: "Field residuals on independent skies"
    description: |
      The 260 independent skies of bin_covariance_sims, decoupled with the
      production field workspaces, against the window-corrected model
      (integer bins) and the spherical estimator reference, over
      1000 <= ell < 4000 for SFL, STG and ZEA: band-mean residuals with their
      errors, Hotelling tests of the mean against each reference, and the
      largest single-bin residual; and, on the 20 production skies, BICEP
      minus ZEA in EE. Written as residual_summary.json.
    inputs: [pipeline_windows, residual_estimator_response, bin_covariance_sims, coupling_matrices, flatsky_masks]
    decisions: [bandpower_width]
    recipe:
      command: >-
        bash env.sh python3 analysis/residual_summary.py
        --pipeline-windows {inputs.pipeline_windows}
        --residual-estimator-response {inputs.residual_estimator_response}
        --bin-covariance-sims {inputs.bin_covariance_sims}
        --coupling-matrices {inputs.coupling_matrices}
        --flatsky-masks {inputs.flatsky_masks}
        --delta-ell {decisions.bandpower_width}
        --out {output}
      resources:
        cpus: 1
        memory: 4Gi
        disk: 1Gi
        time_limit: 30m

  - id: scalar_summary
    type: data
    label: "Scalar leg against the coupling matrix"
    description: |
      CMB TT skies and independent unit-C_ell white skies through the scalar
      leg on the 1500d field, against the scalar block of the forward model
      applied to the known input, per projection and band: measured over
      model for both skies; the white bandpower recovered by a diagonal
      transfer function calibrated on the TT skies, measured and predicted;
      measured white over the coupling matrix applied to the white input;
      and the standard errors of their means over 1000 <= ell < 4000.
      Written as scalar_summary.npz and the same table as scalar_summary.csv.
    inputs: [scalar_bandpowers, simulation_windows, theory_spectra, shear_moments]
    recipe:
      command: >-
        bash env.sh python3 analysis/scalar_summary.py
        --scalar-bandpowers {inputs.scalar_bandpowers}
        --simulation-windows {inputs.simulation_windows}
        --theory-spectra {inputs.theory_spectra}
        --shear-moments {inputs.shear_moments}
        --out {output}
      resources:
        cpus: 1
        memory: 2Gi
        disk: 1Gi
        time_limit: 15m

  - id: leakage_second_order
    type: data
    label: "The leakage law at large shear"
    description: |
      SFL on the two largest rectangles, rect_7p81 and rect_10p06, where the
      local shear reaches 0.5-0.6: per band, measured BB/EE with STG's floor
      subtracted and its error over seeds, against the forward model, the
      leading-order law 2<g^2>, and the exact local kernel
      2<g^2 (1 - 3 g^2 / 4)>. It tests whether the second-order terms the
      forward model keeps are the ones the measurement needs. The paper
      quotes none of it yet. Written as leakage_second_order.json, with a
      diagnostic plot.
    inputs: [bandpowers, simulation_windows, theory_spectra, shear_moments]
    recipe:
      command: >-
        bash env.sh python3 analysis/leakage_second_order.py
        --bandpowers {inputs.bandpowers}
        --simulation-windows {inputs.simulation_windows}
        --theory-spectra {inputs.theory_spectra}
        --shear-moments {inputs.shear_moments}
        --out {output}
      resources:
        cpus: 1
        memory: 2Gi
        disk: 1Gi
        time_limit: 15m

  # --- Bandpower covariance, the noisy inversion, the projection survey -----
  - id: bin_covariance_comparison
    type: data
    label: "Projected against homogeneous bandpower covariance"
    description: |
      The 260 projected 1500d skies against the 256 homogeneous controls,
      per chart (ZEA, SFL, STG), spectrum and estimator (coupled, and
      decoupled through the width-five response aggregated exactly): the
      ratio of band means, of fractional variances, and the correlation of
      bins one, two and four apart, over several ell ranges, with
      delete-one-sky jackknife errors. Two widths: bandpower_width, and 100,
      written literally as the width of Balkenhol et al.'s Table III, which
      the paper compares with. Written as bin_covariance_comparison.json,
      with moments.npz and two diagnostic plots.
    inputs: [bin_covariance_sims, bin_covariance_flat_controls, fine_coupling_matrices]
    decisions: [bandpower_width]
    recipe:
      command: >-
        bash env.sh python3 analysis/compare_bin_covariance.py
        --bin-covariance-sims {inputs.bin_covariance_sims}
        --bin-covariance-flat-controls {inputs.bin_covariance_flat_controls}
        --fine-coupling-matrices {inputs.fine_coupling_matrices}
        --widths {decisions.bandpower_width} 100
        --binwise-widths {decisions.bandpower_width} 100
        --out {output}
      resources:
        cpus: 2
        memory: 2Gi
        disk: 1Gi
        time_limit: 30m

  - id: noisy_inversion_summary
    type: data
    label: "Inverting the response on noisy skies"
    description: |
      The response inverted on the 260 noisy SPT-3G-like lensed 1500d skies,
      split-cross and noise-free, per chart: one amplitude per 500-wide band
      over 500-4000 of the beamed lensed TT, EE and BB, fitted through the
      scalar block and the joint EE/BB system with the exterior at its
      model, with equal and scatter weights; per-band and combined biases
      and the variance relative to ZEA's, with jackknife errors. The beam
      and noise depth come from the sims. Written as
      noisy_inversion_summary.json, with amplitudes.npz and two diagnostic
      plots.
    inputs: [noisy_inversion_sims, fine_coupling_matrices, flatsky_masks, bandpowers,
             simulation_windows, theory_spectra, shear_moments]
    recipe:
      command: >-
        bash env.sh python3 analysis/noisy_inversion.py
        --noisy-inversion-sims {inputs.noisy_inversion_sims}
        --fine-coupling-matrices {inputs.fine_coupling_matrices}
        --flatsky-masks {inputs.flatsky_masks}
        --bandpowers {inputs.bandpowers}
        --simulation-windows {inputs.simulation_windows}
        --theory-spectra {inputs.theory_spectra}
        --shear-moments {inputs.shear_moments}
        --out {output}
      resources:
        cpus: 4
        memory: 2Gi
        disk: 1Gi
        time_limit: 30m

  - id: projection_survey
    type: data
    label: "127 projections of the 1500d field"
    description: |
      Every PROJ projection that maps the unapodized 1500d rectangle,
      sampled uniformly in area, with its aspect (centre and heading) and
      shape parameters optimized twice, once for <g^2> and once for the
      variance of ln mu; the paper's four at their fixed definitions; and
      the least-squares and Chebyshev conformal optima, solved in Mercator
      coordinates. Needs no pipeline data. Runs under uv from the script's
      inline dependencies, since the SPT environment has no PROJ. Written
      as projection_survey.json, with a diagnostic plot.
    recipe:
      command: uv run analysis/projection_survey.py --out {output}
      resources:
        cpus: 1
        # 11 min.
        memory: 2Gi
        disk: 1Gi
        time_limit: 1h

  # --- The paper's macros ---------------------------------------------------
  - id: numbers
    type: table
    format: json
    label: "The law, the 1500d field and the theory"
    description: |
      The macros of numbers.tex: the leakage coefficient fitted over every
      sheared (footprint, projection) pair and its scatter; SFL's and
      BICEP's measured-over-modelled BB/EE band by band; on the 1500d field,
      the SFL/BICEP leakage ratio measured and from 2<g^2>, Hann-averaged EE
      over the input, the STG floor and the leakage against lensed BB;
      power conservation between the legs over every footprint; the damping
      tail's slope and the lift it implies; the run's band limit and the
      field's sky fraction; and what spt3g's flattening angle would add to
      SFL's modelled leakage, computed from the field mask under both
      options.
    inputs: [bandpowers, simulation_windows, theory_spectra, shear_moments, healpix_masks, field_spectra]
    recipe:
      command: >-
        bash env.sh python3 analysis/paper_numbers/main.py
        --bandpowers {inputs.bandpowers}
        --simulation-windows {inputs.simulation_windows}
        --theory-spectra {inputs.theory_spectra}
        --shear-moments {inputs.shear_moments}
        --healpix-masks {inputs.healpix_masks}
        --field-spectra {inputs.field_spectra}
        --out {output}
      resources:
        cpus: 1
        # About 5 min, most of it the field mask's moments under both
        # flattening options.
        memory: 8Gi
        disk: 1Gi
        time_limit: 30m

  - id: scalar_numbers
    type: table
    format: json
    label: "Diagonal-transfer macros"
    description: |
      The macros of scalar_numbers.tex, on the 1500d field over
      1000 <= ell < 4000: the white bandpower's error after a TT-calibrated
      diagonal transfer function (SFL's mean, and the worst of SFL, STG and
      ZEA), and the worst error of the coupling matrix applied to the white
      input.
    inputs: [scalar_summary]
    recipe:
      command: >-
        bash env.sh python3 analysis/paper_numbers/scalar_numbers.py
        --scalar-summary {inputs.scalar_summary} --out {output}
      resources:
        cpus: 1
        memory: 1Gi
        disk: 1Gi
        time_limit: 5m

  - id: residual_numbers
    type: table
    format: json
    label: "Field residual macros"
    description: |
      The macros of residual_numbers.tex: the worst TT and EE band-mean
      residual of the independent skies against the spherical reference,
      STG's worst EE bin, the range of SFL's and ZEA's EE p-values, SFL's
      and ZEA's BB residual on the integer-bin model, and BICEP minus ZEA in
      EE on the production skies.
    inputs: [residual_summary]
    recipe:
      command: >-
        bash env.sh python3 analysis/paper_numbers/residual_numbers.py
        --residual-summary {inputs.residual_summary} --out {output}
      resources:
        cpus: 1
        memory: 1Gi
        disk: 1Gi
        time_limit: 5m

  - id: covariance_numbers
    type: table
    format: json
    label: "Bandpower covariance macros"
    description: |
      The macros of covariance_numbers.tex: the number of projected skies;
      SFL's TT, EE and BB fractional-variance ratio to the controls over
      3500-4800 at the bandpower width; and ZEA's adjacent-bin correlation
      in TT and EE over 2000-3000 at width 100, for the SPT comparison.
      Refuses an incomplete ensemble.
    inputs: [bin_covariance_comparison]
    decisions: [bandpower_width]
    recipe:
      command: >-
        bash env.sh python3 analysis/paper_numbers/covariance_numbers.py
        --bin-covariance-comparison {inputs.bin_covariance_comparison}
        --delta-ell {decisions.bandpower_width} --out {output}
      resources:
        cpus: 1
        memory: 1Gi
        disk: 1Gi
        time_limit: 5m

  - id: noisy_numbers
    type: table
    format: json
    label: "Noisy-inversion macros"
    description: |
      The macros of noisy_numbers.tex, scatter-weighted estimator on the
      split-cross spectra: the number of skies, STG's and SFL's variance
      cost relative to ZEA, and ZEA's and SFL's BB bias in units of the
      input lensed BB.
    inputs: [noisy_inversion_summary]
    recipe:
      command: >-
        bash env.sh python3 analysis/paper_numbers/noisy_numbers.py
        --noisy-inversion-summary {inputs.noisy_inversion_summary} --out {output}
      resources:
        cpus: 1
        memory: 1Gi
        disk: 1Gi
        time_limit: 5m

  - id: survey_numbers
    type: table
    format: json
    label: "Projection-survey macros"
    description: |
      The macros of survey_numbers.tex: STG's spread in ln mu over the best
      Lambert conformal conic's, ZEA's <g^2> over the best Albers conic's,
      the conic's excess over the least-squares conformal optimum, and SFL's
      <g^2> over SFL with the field moved onto its equator.
    inputs: [projection_survey]
    recipe:
      command: >-
        bash env.sh python3 analysis/paper_numbers/survey_numbers.py
        --projection-survey {inputs.projection_survey} --out {output}
      resources:
        cpus: 1
        memory: 1Gi
        disk: 1Gi
        time_limit: 5m

  # --- The paper's figures --------------------------------------------------
  - id: fig_shear_schematic
    type: figure
    format: png
    label: "Figure 1: a projection as a lens"
    description: |
      BICEP's grid over the 1500d field with Tissot's indicatrix; at three
      points, a sky circle and its image on the grid, with that point's g
      and mu and one E-mode plane wave whose polarization the grid no
      longer reads at right angles to its crests; each point's EE read on
      the grid against the input; and the footprint average. Writes
      shear_schematic.pdf, which the paper includes, and
      fig_shear_schematic.png.
    inputs: [theory_spectra]
    recipe:
      command: >-
        bash env.sh python3 analysis/plot_shear_schematic.py
        --theory-spectra {inputs.theory_spectra} --out {output}
      resources:
        cpus: 1
        memory: 1Gi
        disk: 1Gi
        time_limit: 10m

  - id: fig_jacobian_invariants
    type: figure
    format: png
    label: "Figure 2: shear and magnification of the four projections"
    description: |
      The local shear g and magnification mu of SFL, STG, ZEA and BICEP over
      the grid, relative to the sky, with the 1500d field's edge and the
      largest footprint's contour on every panel and the sky a projection
      cannot reach hatched. Writes jacobian_invariants.pdf, which the paper
      includes, and fig_jacobian_invariants.png.
    inputs: [mask_contours]
    recipe:
      command: >-
        bash env.sh python3 analysis/plot_jacobian_invariants.py
        --mask-contours {inputs.mask_contours} --out {output}
      resources:
        cpus: 1
        memory: 1Gi
        disk: 1Gi
        time_limit: 10m

  - id: fig_spectra_model
    type: figure
    format: png
    label: "Figure 3: spectra on the 1500d field and the coupling matrix"
    description: |
      TT and EE over the input and BB/EE on the 1500d field, the mean of the
      20 skies per bandpower as points and the coupling matrix applied to
      the input as lines, per projection, with the lensed BB/EE for scale;
      simulation windows divided out of both. Writes spectra_model.pdf,
      which the paper includes, and fig_spectra_model.png.
    inputs: [pipeline_windows, residual_estimator_response, theory_spectra]
    recipe:
      command: >-
        bash env.sh python3 analysis/plot_spectra_model.py
        --pipeline-windows {inputs.pipeline_windows}
        --residual-estimator-response {inputs.residual_estimator_response}
        --theory-spectra {inputs.theory_spectra} --out {output}
      resources:
        cpus: 1
        memory: 1Gi
        disk: 1Gi
        time_limit: 10m

  - id: fig_shear_leakage
    type: figure
    format: png
    label: "Figure 4: E-to-B leakage against 2<g^2>"
    description: |
      Measured BB/EE over 1000 < ell < 3000 against <g^2> for every sheared
      (footprint, projection) pair, with the line BB/EE = 2<g^2>, and the
      residual about it by footprint size with the fitted coefficient's rms
      band. Also prints the full leakage report (the law, the STG floor, the
      reductions and weights, the band-by-band test against the forward
      model). Writes shear_leakage.pdf, which the paper includes, and
      fig_shear_leakage.png.
    inputs: [bandpowers, simulation_windows, theory_spectra, shear_moments]
    recipe:
      command: >-
        bash env.sh python3 analysis/shear_leakage.py
        --bandpowers {inputs.bandpowers}
        --simulation-windows {inputs.simulation_windows}
        --theory-spectra {inputs.theory_spectra}
        --shear-moments {inputs.shear_moments}
        --out {output}
      resources:
        cpus: 1
        memory: 2Gi
        disk: 1Gi
        time_limit: 15m

  - id: fig_transfer_error
    type: figure
    format: png
    label: "Figure 5: what a diagonal transfer function misses"
    description: |
      On the 1500d field, per projection: the white bandpower's error after
      a TT-calibrated diagonal transfer function, measured and from the
      forward model alone, and the white sky's residual against the full
      coupling matrix with its standard error. Writes transfer_error.pdf,
      which the paper includes, and fig_transfer_error.png.
    inputs: [scalar_summary]
    recipe:
      command: >-
        bash env.sh python3 analysis/plot_transfer_error.py
        --scalar-summary {inputs.scalar_summary} --out {output}
      resources:
        cpus: 1
        memory: 1Gi
        disk: 1Gi
        time_limit: 10m

  # --- The paper --------------------------------------------------------------
  - id: paper
    type: report
    format: pdf
    label: "The letter"
    description: |
      paper/main.tex compiled against the numbers and figure outputs, with
      paper/legacy_numbers.tex, the hand-kept macros from analyses outside
      this spec. The build is the gate: it fails if main.tex inputs a file
      or includes a figure that neither these outputs nor paper/ hold, or
      quotes a macro no input file defines, and it lists the macros the
      outputs make that the prose does not quote. Writes paper.pdf.
    inputs: [numbers, scalar_numbers, residual_numbers, covariance_numbers, noisy_numbers,
             survey_numbers, fig_shear_schematic, fig_jacobian_invariants, fig_spectra_model,
             fig_shear_leakage, fig_transfer_error]
    recipe:
      command: >-
        python3 paper/build.py --out {output}
        {inputs.numbers} {inputs.scalar_numbers} {inputs.residual_numbers}
        {inputs.covariance_numbers} {inputs.noisy_numbers} {inputs.survey_numbers}
        {inputs.fig_shear_schematic} {inputs.fig_jacobian_invariants}
        {inputs.fig_spectra_model} {inputs.fig_shear_leakage} {inputs.fig_transfer_error}
      resources:
        cpus: 1
        memory: 1Gi
        disk: 1Gi
        time_limit: 10m

# ---------------------------------------------------------------------------
# DECISIONS
# ---------------------------------------------------------------------------
decisions:
  cosmology:
    label: "Cosmology of the simulated skies"
    tags: [theory]
    rationale: |
      The skies are Gaussian draws from CAMB spectra, so the cosmology sets
      the input power every measured spectrum is compared with. Projection
      effects are relative distortions of that power: they depend on its
      shape (the slope of the damping tail, the acoustic phases) and not on
      the precise parameters, so one standard cosmology suffices. Planck 2018
      base-plikHM-TTTEEE-lowl-lowE-lensing best fit, the parameters of
      SPT's own simulation parameter file; src/stages/_decisions.py holds
      them.
    default: planck2018
    options:
      planck2018:
        label: "Planck 2018 best fit"
        description: "base-plikHM-TTTEEE-lowl-lowE-lensing chi^2 minimum; no tensors, one 0.06 eV neutrino."

  intermediate_nside:
    label: "Intermediate HEALPix synthesis resolution"
    tags: [resolution]
    rationale: |
      The band-limited alms are synthesized back onto a HEALPix grid, and
      that grid is bilinearly interpolated, with oversampling, onto the
      flat-sky pixels; the masks are built on the same grid so that mask and
      map share a pixelization before projection. The harmonic content is
      fixed by ell_max, so what this choice sets is how finely the field is
      sampled where the interpolation reads it. Interpolating between HEALPix
      rings adds a window in the sky frame and an incoherent B that no window
      removes: at Nside 4096, doubling the subsamples per flat pixel lowers
      STG's BB/EE by 32% while EE moves by 0.7%. Nside 8192 halves the ring
      spacing. It costs four times the memory of Nside 4096 (6.4 GB per dense
      map).
    default: nside8192
    options:
      nside8192:
        label: "Nside 8192"
        description: "The finest sampling for the interpolation."
      nside4096:
        label: "Nside 4096"
        description: "A quarter of the memory; coarser ring spacing, so a larger interpolation window and more incoherent B."

  ell_max:
    label: "Simulation band limit"
    tags: [resolution]
    rationale: |
      The alms are truncated at ell_max, which is both the sky's band limit
      and the top of the bandpowers. The 2 arcmin grid's Nyquist multipole
      along each axis is 5400, so a band limit of 6000 aliases power down to
      2 x 5400 - 6000 = 4800 for a unit Jacobian; band means are compared up
      to 4000 and spectra plotted up to 4800, which reaches the damping tail
      where the shear's distortion of EE is largest (SFL's EE near ell = 4000).
      A band limit of 4000 would stay clear of aliasing but stop short of
      that range. The cost is in the synthesis onto the intermediate grid
      and in the coupling-matrix build, which grow with it.
    default: l6000
    options:
      l6000:
        label: "ell_max 6000"
        description: "Reaches the damping tail; aliasing enters above ell = 4800."
      l4000:
        label: "ell_max 4000"
        description: "Below the grid's Nyquist multipole, so no aliasing, but no measurement above ell = 4000."

  bandpower_width:
    label: "Bandpower bin width"
    tags: [resolution]
    rationale: |
      Uniform linear bins, flat-weighted, from ell = 0 to ell_max. CMB
      analyses bin linearly and coarser than the mask's coupling kernel:
      SPT-3G D1 uses a uniform width of 50 (arXiv:2506.20707), ACT DR6 a
      minimum width of 50 (arXiv:2503.14452), Planck's plik 30, and BICEP2
      reports bands about 35 wide by its own convention, with neighbouring
      bands up to ~10% correlated (arXiv:1403.3985). Logarithmic
      bins at low ell fall below the kernel width and correlate neighbouring
      bandpowers. For the smallest footprint, rect_0p77, the azimuthally
      averaged |FFT|^2 of the flat-sky mask falls below 1% of its peak by
      ell = 16-26 and 0.1% by ell = 16-41 across the projections, so width 50
      exceeds every mask's kernel. It also merges 2:1
      into the width-100 bands used to compare band correlations with
      SPT-3G. The coupling-matrix cost does not depend on the bin width
      (15-26 h on 8 cores for a 3 Mpx window at widths 10 and 50 alike): it
      is set by the mask's Fourier grid, so the width is a convention, not a
      cost.
    default: d50
    options:
      d50:
        label: "Width 50"
        description: "Wider than every mask's coupling kernel; the SPT-3G convention."
      d10:
        label: "Width 10"
        description: "Resolves finer structure in ell; narrower than the kernel of the small masks, so neighbouring bands correlate."

  interpolation:
    label: "HEALPix to flat-sky resampling"
    tags: [systematics]
    rationale: |
      How map values move from the HEALPix grid to the flat-sky pixels.
      Bilinear interpolation onto a grid oversampled 8x per axis, then
      averaged 8 x 8 down to the 2 arcmin pixel, approximates the pixel
      integral of the band-limited sky. Interpolation and averaging each add a
      window, the first in the sky frame and the second in the map frame, so
      their product depends on the projection, the spin and the mode
      direction; the analysis computes it from each Jacobian and the known
      input spectrum and divides it out, and plane waves through the actual
      projector match that calculation to 0.025%. Nearest-neighbour sampling
      leaves pixelization noise that is anisotropic on the flat grid and can
      masquerade as leakage, and interpolation without oversampling leaves
      the pixel as a point sample.
    default: interp_rebin8
    options:
      interp_rebin8:
        label: "Bilinear, oversampled 8x and averaged"
        description: "Approximates the pixel integral; its window is computed and divided out."
      interp_rebin1:
        label: "Bilinear, no oversampling"
        description: "Point samples of the interpolated field; isolates what the averaging contributes."
      nearest:
        label: "Nearest neighbour"
        description: "No interpolation; the bare pixelization floor."

  apodization:
    label: "Mask apodization"
    tags: [masking]
    rationale: |
      Every footprint mask is tapered with NaMaster's C2 kernel over 2.5 deg. The pure-B estimator takes derivatives of the
      mask, so the taper must be smooth; a sharp edge also rings in Fourier
      space and mixes power across the coupling kernel. A wider taper
      suppresses this at the cost of sky area, and the masks' index records
      the realized sky fraction for that reason. The smallest rectangle is
      12.6 deg tall, so even that footprint keeps an untapered core 7.6 deg
      tall.
    default: c2_2p5deg
    options:
      c2_2p5deg:
        label: "C2, 2.5 deg"
        description: "Smooth to first derivative; the taper of every mask in the paper."
      c1_2p5deg:
        label: "C1, 2.5 deg"
        description: "Same width, a kernel with a kinked derivative; separates kernel shape from width."
      c2_5deg:
        label: "C2, 5 deg"
        description: "Twice the width; less edge ringing, less usable sky."

  flattening:
    label: "Polarization flattening angle"
    tags: [estimator]
    rationale: |
      Projecting Q/U rotates the polarization basis by a position-dependent
      angle, which flattening undoes before E and B are formed on the plane.
      Locally the projection is a linear map J, and its polar decomposition
      J = R S splits it into a rotation R and the symmetric shear S; only R
      can be undone. The polar option rotates by R's angle psi_R (paper Eq.
      polar_angle), leaving exactly the shear. spt3g_software's flatten_pol
      rotates by the equal-weight average of the tilts of grid north and
      east, which equals psi_R where the projection is conformal or its
      stretch axes lie along the sky axes or diagonals, and elsewhere misses
      it by (g^2/2) sin 4 beta plus higher orders: up to 2.6 deg on SFL's
      1500d field, zero for BICEP and STG. A rotation by that residual angle
      turns E into B on top of the shear's leakage.
    default: polar
    options:
      polar:
        label: "Polar-decomposition angle"
        description: "Removes the projection's rotation exactly; the maps carry the shear alone."
        insights: [projected_shear_needs_rotation]
      spt3g:
        label: "spt3g flatten_pol"
        description: "The library's averaged angle; adds a second-order rotation in sheared projections."
        insights: [projected_shear_needs_rotation]

  b_purification:
    label: "B-mode purification"
    tags: [estimator]
    rationale: |
      On a cut sky the standard pseudo-C_ell estimator mixes E into B through
      the mask's boundary, by an amount that depends on the mask rather than
      the projection. The pure-B estimator removes the ambiguous modes there,
      so the BB that remains measures what the projection leaks: STG, which
      does not shear, then shows only the pipeline's own floor. Flattened Q
      and U enter NaMaster as a purified spin-two field, and every simulation
      suite that measures B uses the same estimator.
    default: purify
    options:
      purify:
        label: "Pure-B estimator"
        description: "Removes the mask's ambiguous modes, so residual BB is projection leakage."
      standard:
        label: "Standard pseudo-C_ell"
        description: "No purification; shows how much mask-induced mixing purification removes."

  pixel_window:
    label: "Pixel-window correction"
    tags: [systematics]
    rationale: |
      The skies are drawn in harmonic space and synthesized onto the
      intermediate grid as point values of the band-limited field, so they
      carry no HEALPix pixel window. The window the flat maps do
      carry is that of the 2 arcmin flat-sky pixel, a top-hat average whose
      transfer function is averaged over each annulus, since NaMaster bins in
      annuli; the bandpowers are divided by it. The further window of
      interpolation and averaging depends on projection and spin and is
      corrected separately (see interpolation). Dividing by a HEALPix window
      the maps do not carry would over-correct.
    default: flat_only
    options:
      flat_only:
        label: "Flat-sky pixel window"
        description: "Divide by the 2 arcmin top-hat window, the one the maps carry."
      none:
        label: "No correction"
        description: "Spectra roll off at high ell with the flat-sky window."
      healpix_only:
        label: "HEALPix window"
        description: "Divide by hp.pixwin at Nside 8192; over-corrects, since the maps carry no such window."
      healpix_and_flat:
        label: "HEALPix and flat-sky windows"
        description: "Both windows; over-corrects for the same reason."

# ---------------------------------------------------------------------------
# PRIOR INSIGHTS
# ---------------------------------------------------------------------------
# The literature the paper leans on, limited to passages the citation audit
# (paper/citation_audit/quotes.json) verified verbatim against stored source
# text. Each is tagged with the Introduction's mode of use it belongs to.
# Quotes are written as the source renders them (ℓ, B, E-to-B), not in the
# manuscript's LaTeX.
prior_insights:
  flat_tools_need_a_plane:
    claim: >-
      DES Y3 wavelet-phase-harmonic statistics are measured on flat
      gnomonic patches because the wavelet package works only in two
      dimensions.
    created_at: "2026-11-19T00:00:00Z"
    tags: [flat-sky-practice]
    evidence:
      - id: gatti24
        doi: "10.1103/PhysRevD.109.063534"
        quote:
          exact: "works on a two-dimensional projection"

  pipelines_move_maps_between_grids:
    claim: >-
      An SPT-3G lensing pipeline reprojects maps from a Lambert grid to an
      equirectangular one and back to apply its transfer-function weights.
    created_at: "2026-11-19T00:00:00Z"
    tags: [moving-maps-between-grids]
    evidence:
      - id: ge24
        doi: "10.1103/PhysRevD.111.083534"
        quote:
          exact: "projecting from a Lambert to an Equirectangular pixelization, applying some weights, then projecting back"

  projection_costs_information:
    claim: >-
      When simulations and data pass through the same projection, its
      distortion does not bias simulation-based inference but can make the
      compression suboptimal.
    created_at: "2026-11-19T00:00:00Z"
    tags: [known-consequences]
    evidence:
      - id: jeffrey25
        doi: "10.1093/mnras/stae2629"
        quote:
          exact: "makes the compression potentially suboptimal"

  lambert_correlates_bins:
    claim: >-
      In SPT-3G's 2018 temperature spectra the Lambert azimuthal equal-area
      projection, which does not preserve angles, increases bin-to-bin
      correlations at high ℓ.
    created_at: "2026-11-19T00:00:00Z"
    tags: [known-consequences]
    evidence:
      - id: balkenhol23
        doi: "10.1103/PhysRevD.108.023510"
        quote:
          exact: "does not preserve angles and leads to increasing bin-to-bin correlations at high ℓ"

  projection_correlation_hard_to_model:
    claim: >-
      SPT-3G D1 found projection-induced excess bin correlations at high ℓ
      hard to compute analytically, and moved its spectra to full spherical
      harmonic transforms.
    created_at: "2026-11-19T00:00:00Z"
    tags: [known-consequences]
    evidence:
      - id: spt3gd1
        doi: "10.1103/7wt3-9v2y"
        quote:
          exact: "projection effects were causing excess correlation between power spectrum bins at high ℓ, in a manner that is difficult to compute analytically"

  projected_shear_needs_rotation:
    claim: >-
      Projecting a spin-two shear field without correcting its orientation
      generates substantial B modes; Euclid mass-map preparation rotates it
      and takes the residual as negligible.
    created_at: "2026-11-19T00:00:00Z"
    tags: [known-consequences]
    evidence:
      - id: pires20
        doi: "10.1051/0004-6361/201936865"
        quote:
          exact: "can generate substantial B modes"

  conformal_projection_best_for_mass_maps:
    claim: >-
      For weak-lensing convergence maps, the conformal stereographic
      projection performed best among the planar projections compared.
    created_at: "2026-11-19T00:00:00Z"
    tags: [known-consequences]
    evidence:
      - id: wallis17
        doi: "10.1093/mnras/stab3235"
        quote:
          exact: "The stereographic projection, which is conformal and so preserves local angles, is the most effective planar projection."

  large_patch_projection_leaks:
    claim: >-
      Neural-network recovery of CMB polarization maps meets significant
      E-to-B leakage when larger sky regions are projected onto a plane.
    created_at: "2026-11-19T00:00:00Z"
    tags: [known-consequences]
    evidence:
      - id: casas23
        doi: "10.1088/1475-7516/2025/10/063"
        quote:
          exact: "significant E-to-B leakage when projecting larger sky regions onto a flat plane"

  other_projections_distort_less:
    claim: >-
      BICEP/Keck, whose RA/Dec grid leaks E into B under Fourier transform,
      note that other map projections distort significantly less.
    created_at: "2026-11-19T00:00:00Z"
    tags: [known-consequences]
    evidence:
      - id: bk7
        doi: "10.3847/0004-637X/825/1/66"
        quote:
          exact: "other map projections will have significantly lower distortion"

  partial_sky_sht_matches_fft:
    claim: >-
      Partial-sky spherical harmonic transforms now cost about as much as,
      or less than, the 2D FFT at the same resolution, even on small fields.
    created_at: "2026-11-19T00:00:00Z"
    tags: [move-to-sphere]
    evidence:
      - id: carron26
        doi: "10.48550/arXiv.2603.17166"
        quote:
          exact: "comparable or sometimes lower cost than the 2D FFT at the same resolution"

# ---------------------------------------------------------------------------
# FINDINGS
# ---------------------------------------------------------------------------
# The paper's claims. Numbers are quoted as the macro lines the cited output
# writes, never retyped.
findings:
  projection_is_a_lens:
    claim: >-
      A projection acts on the sky as a lens with shear and magnification
      fixed in closed form by its Jacobian: the shear averages scalar spectra
      over a band of multipoles, and a parameter-free coupling matrix built
      from the Jacobian and the mask predicts the projected TT, EE and BB of
      the 1500d field in the mean on independent skies.
    created_at: "2026-11-19T00:00:00Z"
    derived: true
    evidence:
      - id: field_model
        artifact: fig_spectra_model
      - id: field_residuals
        artifact: residual_numbers
        quote:
          exact: "\\newcommand{\\residEECleanWorst}{0.05\\%}"
      - id: field_band_average
        artifact: numbers
        quote:
          exact: "\\newcommand{\\EEboxSFLfourK}{2.14}"

  leakage_law:
    claim: >-
      The shear turns a fraction 2<g^2> of EE into BB, <g^2> being the mean
      squared shear under the squared mask; a fit of the coefficient over
      every sheared footprint and projection, across four decades in <g^2>,
      returns close to the derived 2.
    created_at: "2026-11-19T00:00:00Z"
    derived: true
    evidence:
      - id: law_fit
        artifact: numbers
        quote:
          exact: "\\newcommand{\\fitcoef}{2.0178}"
      - id: law_figure
        artifact: fig_shear_leakage
      - id: law_shear_moments
        artifact: shear_moments

  leakage_law_second_order:
    claim: >-
      SFL's measured BB/EE over 2<g^2> rises with sky fraction, to +3.8% on
      the largest rectangle (rect_10p06, 1000 < ell < 3000), where the local
      shear reaches 0.5-0.6; the coupling matrix, which keeps the
      second-order terms, reproduces it to about 0.1%. ZEA and BICEP stay
      within the fit's scatter.
    created_at: "2026-11-19T00:00:00Z"
    derived: true
    evidence:
      - id: second_order_bands
        artifact: leakage_second_order
      - id: residual_by_footprint
        artifact: fig_shear_leakage

  covariance_mostly_unaffected:
    claim: >-
      The coupling matrix maps means, not covariances. On ZEA and STG the
      TT and EE fractional variances stay within a few percent of
      homogeneous controls, while SFL's are inflated several-fold at high
      ell; ZEA's adjacent-band correlations are consistent with zero, so
      projection alone does not produce the bin correlations SPT-3G reports
      on Lambert maps.
    created_at: "2026-11-19T00:00:00Z"
    derived: true
    evidence:
      - id: zea_adjacent_correlation
        artifact: covariance_numbers
        quote:
          exact: "\\newcommand{\\covZEATTSPTAdjacent}{-0.016}"
      - id: sfl_variance_inflation
        artifact: covariance_numbers
        quote:
          exact: "\\newcommand{\\covSFLEEHighVariance}{3.87}"
      - id: variance_ratios
        artifact: bin_covariance_comparison

  conformal_no_leak_equal_area_no_magnification:
    claim: >-
      Conformal projections do not leak and equal-area projections do not
      magnify: STG's BB on the 1500d field is a numerical floor while its
      magnification lowers EE, and ZEA's EE stays close to the input while
      it leaks a fraction of the lensed BB.
    created_at: "2026-11-19T00:00:00Z"
    derived: true
    evidence:
      - id: stg_floor
        artifact: numbers
        quote:
          exact: "\\newcommand{\\floorField}{$4.9\\times10^{-8}$}"
      - id: zea_ee
        artifact: numbers
        quote:
          exact: "\\newcommand{\\EEboxZEAdev}{1\\%}"
      - id: jacobian_maps
        artifact: fig_jacobian_invariants

  diagonal_transfer_function_fails:
    claim: >-
      Decoupling a projection needs the full coupling matrix: a diagonal
      transfer function calibrated on CMB simulations carries the CMB's
      acoustic phase and mis-corrects a white spectrum on SFL and STG, and
      barely on ZEA, while the matrix applied to the white input matches its
      bandpowers.
    created_at: "2026-11-19T00:00:00Z"
    derived: true
    evidence:
      - id: transfer_error
        artifact: scalar_numbers
        quote:
          exact: "\\newcommand{\\tfSFLworst}{53\\%}"
      - id: transfer_figure
        artifact: fig_transfer_error

  choose_rather_than_correct:
    claim: >-
      Decoupling restores the mean of a sheared grid's spectra but not their
      variance: on noisy lensed skies ZEA's corrected BB is unbiased and
      SFL's is off by a few percent of the lensed BB, from its lowest band,
      yet SFL's corrected spectra cost several times ZEA's variance, and far
      more in B, where the leaked E's sample variance remains, whereas STG
      costs almost none. A projection is better chosen than corrected.
    created_at: "2026-11-19T00:00:00Z"
    derived: true
    evidence:
      - id: sfl_b_cost
        artifact: noisy_numbers
        quote:
          exact: "\\newcommand{\\noisyCostSFLBB}{$52 \\pm 4$}"
      - id: stg_cost
        artifact: noisy_numbers
        quote:
          exact: "\\newcommand{\\noisyCostSTGEE}{$1.03 \\pm 0.04$}"
      - id: inversion_summary
        artifact: noisy_inversion_summary

  projection_survey_corollary:
    claim: >-
      Among 127 PROJ projections optimized for the 1500d field, conics fit a
      band in declination best within each class (the Lambert conformal
      conic over STG, the Albers equal-area conic over ZEA), and a
      projection's aspect matters more than its family, but the gains are
      factors of a few and do not change the choice of class.
    created_at: "2026-11-19T00:00:00Z"
    derived: true
    evidence:
      - id: survey_conformal
        artifact: survey_numbers
        quote:
          exact: "\\newcommand{\\surveyLCCoverSTG}{2.2}"
      - id: survey_equal_area
        artifact: survey_numbers
        quote:
          exact: "\\newcommand{\\surveyZEAoverAEA}{3.1}"
      - id: survey_full
        artifact: projection_survey
