# ASTRA specification: flat-sky projection effects on CMB spectra.
#
# EXECUTION. Recipes run on the host, with no container, through the launcher
# env.sh at the repo root. On amundsen it defers to the SPT-3G build's
# env-shell.sh; on an Open Science Pool worker, where /home does not exist, it
# unpacks the shipped spt3g_build.tar.gz and activates the CVMFS py3-v5
# toolset (pymaster 2.0, healpy 1.16.6). The same command therefore runs
# locally and under `lc run --executor htcondor --profile htcondor9`.
# env-shell.sh word-splits quoted arguments, so recipes pass scripts by path,
# never `python -c "..."`.
#
# MEMORY. amundsen caps memory at 60 GiB per UNIX user, shared by every process
# the account runs. One map2alm at Nside 8192 peaks near 49 GB, so
# preprocessed_alms nearly fills the cap by itself: run nothing else at Nside
# 8192 beside it. An over-cap process is SIGKILLed with no traceback and an
# empty log; `dmesg -T | grep oom` is the only evidence. The `memory:` figures
# below are grid requests, not a budget enforced locally.
#
# INPUT FINGERPRINTING. lightcone sha256s directory inputs recursively on every
# run, so unlensed_sims (1.5 TB) is declared by one representative file and
# its recipe is handed the full directory as literal text.
#
# CODE IS NOT AN INPUT. No script is declared as an input, so editing a script
# does not mark its outputs stale. After a change that alters results, rerun
# the affected outputs by hand (`lc run --force <output>`).
#
# Each recipe passes every input it reads as {inputs.x} and every decision it
# uses as {decisions.x}. A value written literally in a recipe is a deliberate
# choice for that output, and its description says what the value is and why.

version: "0.0.12"
id: pol_projection
name: "Closed-form distortion of projected flat-sky CMB spectra"

description: |
  A flat-sky analysis projects a patch of the sphere onto a plane, and near
  every point the projection rotates, magnifies and shears the field by
  amounts fixed in closed form by its Jacobian. Polarization pipelines remove
  the rotation ("flattening"). The shear remains: it averages each power
  spectrum over a band of multipoles, as lensing does, and it turns the E/B
  basis so that a fraction 2<g^2> of EE appears as BB, <g^2> being the mean
  squared shear under the squared mask. This analysis measures both effects
  on simulations and tests a forward model built from the local geometry.

  The inputs are unlensed HEALPix TQU realizations of the Planck 2018
  best-fit cosmology at Nside 8192, which contain no B modes, so every
  recovered BB bandpower is leakage. Each is transformed to spherical
  harmonics band-limited at ell_max, synthesized on an intermediate HEALPix
  grid, and projected by bilinear interpolation with oversampling onto a
  3300 x 3300 grid of 2 arcmin pixels centred on (RA, dec) = (0, -56 deg),
  in the stereographic (STG), Lambert zenithal equal-area (ZEA), BICEP-style
  equidistant cylindrical (BICEP) and Sanson-Flamsteed (SFL) projections.
  Three legs pass each
  sky through the pipeline: the Q/U leg projects Q and U, flattens them and
  decomposes into E and B on the plane, as a real analysis does; the E/B leg
  decomposes on the sphere and projects E and B as scalars, so it cannot
  leak; the T leg projects temperature as a scalar. Twenty white-spectrum
  skies also pass through the T leg, to test the coupling matrix on a
  spectrum other than the CMB's.

  Spectra are NaMaster flat-sky bandpowers, with B-mode purification on the
  spin-two field, of width 50 up to ell_max 6000, divided by the 2 arcmin
  flat-sky pixel window. Eight footprints share one C2 2.5 deg apodization:
  SPT's 1500d field, the reference, and seven disks concentric with the grid
  from 0.75% to 10% of the sky.

  Further simulation suites support the paper's later sections: 260
  independent skies through the field pipeline and 256 homogeneous controls
  for the bandpower covariance; 260 noisy SPT-3G-like lensed skies for
  inverting the response; controls that isolate the pipeline's own BB floor
  (sky band limit, synthesis grid, estimator sampling); a masked E-mode
  template; a temperature lensing quadratic estimator on projected skies;
  compact-source matched filters; a Gaussian beam applied before
  reprojection; spherical HEALPix and CAR pixel tests; and lognormal
  filtering controls for statistics beyond the power spectrum.

tags: [cmb, polarization, b-modes, flat-sky, projection, spt-3g, namaster]

# ---------------------------------------------------------------------------
# INPUTS
# ---------------------------------------------------------------------------
inputs:
  - id: unlensed_sims
    type: data
    label: "Unlensed TQU realizations"
    description: |
      HEALPix Nside 8192 unlensed TQU realizations in the Planck 2018
      base-plikHM-TTTEEE-lowl-lowE-lensing best-fit cosmology, RING ordering,
      stored as three-column FITS binary tables (TEMPERATURE, Q_POLARISATION,
      U_POLARISATION). Unlensed, so the input BB power is identically zero and
      any recovered BB is projection leakage. The maps carry no HEALPix pixel
      window: the C_ell of their alms matches theory flat to ell = 6000.

      Seed 0 is the representative fingerprint; the full directory
      (/sptgrid/simulation/lensing_maps/unlensed_TQU1, 164 seeds at 9.7 GB
      each) is passed to the recipe as literal text.
    source: /sptgrid/simulation/lensing_maps/unlensed_TQU1/TQU1_planck2018_base_plikHM_TTTEEE_lowl_lowE_lensing_seed0.fits

  - id: theory_spectra
    type: data
    label: "CAMB theory spectra"
    description: |
      Lensed and unlensed TT, EE, BB and TE from CAMB 1.5.4 in the input
      simulations' cosmology (the Planck 2018 base-plikHM-TTTEEE-lowl-lowE-
      lensing best fit; lens_potential_accuracy 2, no tensors), as raw C_ell
      in uK^2 indexed by multipole from ell = 0 to 10050, with the run's
      parameters in a pickled `header`. analysis/theory.py generates it. Every
      stage that needs a theory curve reads this file and slices what it
      uses.
    source: data/theory_spectra.npz

# ---------------------------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------------------------
outputs:
  # --- The main chain: alms, maps, masks, couplings, bandpowers -----------
  - id: preprocessed_alms
    type: data
    label: "Band-limited input alms"
    description: |
      T, E and B spherical-harmonic coefficients of each input realization,
      truncated at ell_max with the monopole and dipole removed. Computed
      once per seed so that every projection leg starts from the identical
      sky, and the legs' differences are projection alone.
    inputs: [unlensed_sims]
    decisions: [ell_max]
    units:
      seed: 0..20
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/preprocess_healpix.py
        --sims-dir /sptgrid/simulation/lensing_maps/unlensed_TQU1
        --seeds {units.seed}
        --lmax {decisions.ell_max}
        --max-procs 4
        --out {output}
      resources:
        cpus: 4
        # map2alm at Nside 8192 with iter 3 peaks near 49 GB.
        memory: 64Gi
        time_limit: 1h

  - id: healpix_masks
    type: data
    label: "Apodized HEALPix footprint masks"
    description: |
      One apodized mask per footprint, built on the intermediate HEALPix grid
      the maps are synthesized onto, so mask and map share a pixelization
      before projection. The footprints are SPT's 1500d field (RA -50 to +50
      deg, dec -70 to -42 deg) and seven disks concentric with the grid,
      nominally 0.75% to 10% of the sky; their shapes are in
      src/stages/_footprints.py. The taper is NaMaster's C1 or C2 kernel
      evaluated at each pixel's exact geodesic distance to the boundary. The
      index records each mask's realized sky fraction at three weightings
      (binary, W, W^2).
    decisions: [intermediate_nside, apodization]
    units:
      footprint: [disk_0p75, disk_1, disk_1p25, disk_1p5, disk_3, disk_5, disk_10, field_1500d]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/make_masks.py
        --nside {decisions.intermediate_nside}
        --apodization {decisions.apodization}
        --footprint {units.footprint}
        --max-procs 2
        --out {output}
      resources:
        cpus: 2
        # Two dense Nside-8192 float64 maps (6.4 GB each, binary and
        # apodized) plus the footprint's pixel vectors and the G3 copy.
        memory: 24Gi
        # Masks are written ring-sparse and gzipped, ~80 MB each at Nside 8192.
        disk: 8Gi
        time_limit: 1h

  - id: projected_qu
    type: data
    label: "Projected Q/U maps (Q/U leg)"
    description: |
      Q and U synthesized from the alms on the intermediate HEALPix grid,
      projected onto the 3300 x 3300, 2 arcmin flat-sky grid centred on
      (0, -56 deg) in each of the four projections, then flattened. This is the
      leg a real flat-sky polarization analysis produces, and the leg that
      carries the E-to-B leakage.
    inputs: [preprocessed_alms]
    decisions: [interpolation, intermediate_nside]
    units:
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/project_qu.py
        --alms {inputs.preprocessed_alms}
        --projections {units.projection}
        --interpolation {decisions.interpolation}
        --nside {decisions.intermediate_nside}
        --res-arcmin 2 --size-deg 110 --ra-deg 0 --dec-deg -56
        --seeds {units.seed}
        --max-procs 4
        --out {output}
      resources:
        cpus: 4
        # 19.1 GB peak and 8.6 min wall per unit at Nside 8192 (/usr/bin/time
        # -v). condor's sampled MemoryUsage underreports the peak 2-3x.
        memory: 24Gi
        disk: 8Gi
        time_limit: 2h

  - id: projected_eb
    type: data
    label: "Projected E/B maps (E/B leg)"
    description: |
      E and B synthesized on the sphere from the same alms, on the same
      intermediate grid, and projected as spin-zero scalars. No spin-two
      basis is ever projected, so this leg has no projection-induced E-to-B
      mixing: it is the leakage-free reference for the Q/U leg.
    inputs: [preprocessed_alms]
    decisions: [interpolation, intermediate_nside]
    units:
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/project_eb.py
        --alms {inputs.preprocessed_alms}
        --projections {units.projection}
        --interpolation {decisions.interpolation}
        --nside {decisions.intermediate_nside}
        --res-arcmin 2 --size-deg 110 --ra-deg 0 --dec-deg -56
        --seeds {units.seed}
        --max-procs 4
        --out {output}
      resources:
        cpus: 4
        # 19.1 GB peak, 7.7 min wall per unit.
        memory: 24Gi
        disk: 8Gi
        time_limit: 2h

  - id: flatsky_masks
    type: data
    label: "Flat-sky footprint masks"
    description: |
      Each footprint's HEALPix mask projected into each of the four
      projections with the maps' interpolation, then cut to the window
      NaMaster analyses; the window sets the flat-sky Fourier grid and so the
      bandpowers. A disk's window is a fixed square, the same in every
      projection, from a hand-maintained table that leaves 1 to 8 deg beyond
      the apodized disk and clips the outer taper of the small disks. The
      field's window is the tightest even-sided rectangle around its support
      in each projection, about three times wider than tall, since a square
      would multiply the coupling-matrix cost.
    inputs: [healpix_masks]
    decisions: [interpolation]
    units:
      footprint: [disk_0p75, disk_1, disk_1p25, disk_1p5, disk_3, disk_5, disk_10, field_1500d]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/project_masks.py
        --healpix-masks {inputs.healpix_masks}
        --footprint {units.footprint}
        --projections ProjSFL ProjSTG ProjZEA ProjBICEP
        --interpolation {decisions.interpolation}
        --res-arcmin 2 --size-deg 110
        --max-procs 2
        --out {output}
      resources:
        cpus: 2
        # One intermediate mask resident plus the 3300^2 flat output; a
        # seven-disk job's condor-sampled MemoryUsage was 1954 MB.
        memory: 8Gi
        disk: 8Gi
        time_limit: 2h

  - id: coupling_matrices
    type: data
    label: "NaMaster mode-coupling workspaces"
    description: |
      Flat-sky NaMaster workspaces, spin-two with B purification (w22) and
      spin-zero (w00), one pair per projection and footprint, in bins of
      bandpower_width up to ell_max. Independent of the realizations, so every
      seed and every simulation suite on these masks reuses them.
    inputs: [flatsky_masks]
    decisions: [b_purification, ell_max, bandpower_width]
    # The build cost spans three orders of magnitude across the footprints:
    # 11-19 min on 8 cores for disk_0p75, up to 17 h on 8 cores for disk_5,
    # 29-34 h on 32 cores for disk_10, and 2.0 h (BICEP, 1.4 Mpx window) to
    # 5.9 h (STG, 2.2 Mpx) on 16 cores for the field, so the resources are
    # per unit. Threading is 87-92% efficient at 8 and 32 cores. bandpowers
    # shares the projection axis, so each of its units is staged only its
    # own projection's workspaces.
    units:
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
      footprint: [disk_0p75, disk_1, disk_1p25, disk_1p5, disk_3, disk_5, disk_10, field_1500d]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/coupling_matrices.py
        --masks {inputs.flatsky_masks}
        --projections {units.projection}
        --footprint {units.footprint}
        --purify-b {decisions.b_purification}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --max-procs {resources.cpus}
        --out {output}
      resources:
        cpus: 8
        # Peak RSS is 0.3-0.7 GB for disk_0p75 to disk_5 and 1.9 GB for disk_10.
        memory: 4Gi
        disk: 4Gi
        time_limit: 2h
        # OSPool's default duration category kills at 20 h; Long at 40 h.
        extra: {classad_JobDurationCategory: Medium}
        per_unit:
          - when: {footprint: disk_1p5}
            time_limit: 4h
          - when: {footprint: disk_3}
            time_limit: 12h
          - when: {footprint: disk_5}
            cpus: 16
            memory: 6Gi
            time_limit: 16h
          - when: {footprint: disk_10}
            cpus: 32
            memory: 12Gi
            time_limit: 40h
            extra: {classad_JobDurationCategory: Long}
          - when: {footprint: field_1500d}
            cpus: 16
            memory: 8Gi
            time_limit: 12h

  - id: bandpowers
    type: data
    label: "EE and BB bandpowers of both polarization legs"
    description: |
      Decoupled NaMaster EE and BB bandpowers for every projection, footprint
      and realization, for the Q/U leg (which carries the leakage) and the
      E/B leg (the reference), divided by the pixel window the pixel_window
      decision names. Each file holds one (seed, projection) as
      ee[leg, projection, footprint, seed, bin] and the same for bb, with the
      leg, projection and footprint names stored alongside. These are the
      measured spectra of Sect. 4 and the sky-fraction sweep.
    inputs: [projected_qu, projected_eb, flatsky_masks, coupling_matrices]
    decisions: [b_purification, pixel_window, ell_max, bandpower_width]
    # One unit is one (seed, projection) over every footprint and both legs,
    # the axes shared with projected_{qu,eb}, so each grid job is staged only
    # its own ~350 MB of maps. Splitting by footprint would re-ship the same
    # maps eight times.
    units:
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh
        python3 src/stages/namaster_spectra.py
        --qu-maps {inputs.projected_qu}
        --eb-maps {inputs.projected_eb}
        --masks {inputs.flatsky_masks}
        --workspaces {inputs.coupling_matrices}
        --projections {units.projection}
        --seeds {units.seed}
        --purify-b {decisions.b_purification}
        --pixel-window {decisions.pixel_window}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --max-procs 2
        --out {output}
      resources:
        cpus: 2
        # condor-sampled MemoryUsage ~1 GB (underreports 2-3x); 1-6 min wall.
        memory: 16Gi
        disk: 8Gi
        time_limit: 1h

  # --- Scalar legs ----------------------------------------------------------
  - id: scalar_white_alms
    type: data
    label: "White scalar skies"
    description: |
      Independent Gaussian scalar skies with C_ell = 1 for 2 <= ell <= ell_max,
      one per seed. A spectrum with neither the CMB's slope nor its acoustic
      phase, standing in for a Poisson-source-like component: it tests
      whether a coupling matrix, or a transfer function calibrated on the
      CMB, corrects a different spectrum.
    decisions: [ell_max]
    units:
      seed: 0..20
    recipe:
      command: >-
        bash env.sh python3 src/stages/scalar_white_alms.py
        --lmax {decisions.ell_max} --seeds {units.seed}
        --max-procs 2 --out {output}
      resources:
        cpus: 2
        memory: 2Gi
        disk: 2Gi
        time_limit: 1h

  - id: scalar_maps
    type: data
    label: "Projected scalar maps (T leg)"
    description: |
      Scalar skies projected exactly as the polarization maps are, in the four
      paper projections: the CMB temperature from the preprocessed alms
      (spectrum tt) and the white skies (spectrum white).
    inputs: [preprocessed_alms, scalar_white_alms]
    decisions: [interpolation, intermediate_nside]
    units:
      spectrum: [tt, white]
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/scalar_project.py
        --spectrum {units.spectrum}
        --tt-alms {inputs.preprocessed_alms}
        --white-alms {inputs.scalar_white_alms}
        --projections {units.projection} --seeds {units.seed}
        --interpolation {decisions.interpolation}
        --nside {decisions.intermediate_nside}
        --res-arcmin 2 --size-deg 110
        --max-procs 4 --out {output}
      resources:
        cpus: 4
        memory: 20Gi
        disk: 4Gi
        time_limit: 2h

  - id: scalar_bandpowers
    type: data
    label: "Scalar bandpowers (T leg)"
    description: |
      Decoupled spin-zero auto-bandpowers of the scalar maps on every
      footprint, with the polarization bins and pixel-window treatment. Each
      file holds one (spectrum, seed, projection) as cl[footprint, bin]. The
      measured TT and the white-spectrum transfer-error test read these.
    inputs: [scalar_maps, flatsky_masks, coupling_matrices]
    decisions: [pixel_window, ell_max, bandpower_width]
    units:
      spectrum: [tt, white]
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/scalar_spectra.py
        --spectrum {units.spectrum}
        --maps {inputs.scalar_maps}
        --masks {inputs.flatsky_masks} --workspaces {inputs.coupling_matrices}
        --projections {units.projection} --seeds {units.seed}
        --pixel-window {decisions.pixel_window}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --max-procs 2 --out {output}
      resources:
        cpus: 2
        memory: 4Gi
        disk: 4Gi
        time_limit: 1h

  # --- Unit-width field spectra and the bandpower covariance ----------------
  - id: fine_pseudo_spectra
    type: data
    label: "Unit-width 1500d pseudo-spectra of the production skies"
    description: |
      Coupled TT and purified polarization pseudo-spectra (EE, EB, BE, BB) of
      the 20 production skies on the 1500d field, in unit-width annuli to
      ell_max, with the Fourier-cell count of every annulus so that any
      integer-edge rebinning before decoupling is exact. No decoupling and no
      pixel window. They supply the mean spectra the homogeneous covariance
      controls are matched to.
    inputs: [projected_qu, scalar_maps, flatsky_masks]
    decisions: [b_purification, ell_max]
    units:
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/fine_pseudo_spectra.py
        --qu-maps {inputs.projected_qu} --tt-maps {inputs.scalar_maps}
        --masks {inputs.flatsky_masks} --footprint field_1500d
        --projection {units.projection} --seed {units.seed}
        --purify-b {decisions.b_purification} --lmax {decisions.ell_max}
        --max-procs 2 --out {output}
      resources:
        cpus: 2
        memory: 8Gi
        disk: 8Gi
        time_limit: 1h

  - id: fine_coupling_matrices
    type: data
    label: "Width-five 1500d coupling workspaces"
    description: |
      Spin-zero and spin-two NaMaster workspaces on the 1500d field in bins of
      width 5, written literally in the recipe rather than taken from
      bandpower_width: the covariance analysis rebins the unit-width spectra
      to several widths (50 and 100), and a width-5 response aggregates
      exactly to any multiple of 5. Same stage and file names as
      coupling_matrices.
    inputs: [flatsky_masks]
    decisions: [b_purification, ell_max]
    units:
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/coupling_matrices.py
        --masks {inputs.flatsky_masks}
        --projections {units.projection} --footprint field_1500d
        --purify-b {decisions.b_purification}
        --lmax {decisions.ell_max} --delta-ell 5
        --max-procs {resources.cpus} --out {output}
      resources:
        cpus: 16
        memory: 16Gi
        disk: 4Gi
        time_limit: 20h
        # Medium accepts pilots with shorter remaining lifetimes than Long.
        extra: {classad_JobDurationCategory: Medium}

  - id: bin_covariance_sims
    type: data
    label: "Independent projected 1500d skies for the bandpower covariance"
    description: |
      260 independent unlensed Gaussian skies, each synthesized on the
      sphere and passed through the production field pipeline (intermediate
      grid, interpolation, flattening, field mask, pure-B estimator) for SFL,
      STG and ZEA. T and E are drawn independently and true B is zero, so the
      output tests auto-spectrum covariance, not TE or TT-EE covariance.
      Unit-width coupled pseudo-spectra only; no maps are kept. They set the
      band means and covariances of Sect. 4.
    inputs: [flatsky_masks, theory_spectra]
    decisions: [intermediate_nside, interpolation, b_purification, ell_max]
    units:
      seed: 0..260
    recipe:
      command: >-
        bash env.sh python3 src/stages/bin_covariance_sims.py
        --masks {inputs.flatsky_masks} --theory {inputs.theory_spectra}
        --seed {units.seed}
        --nside {decisions.intermediate_nside}
        --interpolation {decisions.interpolation}
        --purify-b {decisions.b_purification} --lmax {decisions.ell_max}
        --max-procs {resources.cpus} --out {output}
      resources:
        cpus: 8
        memory: 24Gi
        disk: 4Gi
        time_limit: 4h

  - id: bin_covariance_control_spectra
    type: data
    label: "Mean spectra for the homogeneous covariance controls"
    description: |
      Mean TT, EE and BB of the 20 production field skies per projection,
      decoupled from the mask in bins of bandpower_width through the
      width-five workspaces aggregated exactly, and keeping their native
      sampling window. Used only to draw homogeneous controls with matched
      radial spectra.
    inputs: [fine_pseudo_spectra, fine_coupling_matrices]
    decisions: [ell_max, bandpower_width]
    recipe:
      command: >-
        bash env.sh python3 src/stages/bin_covariance_controls.py prepare
        --pseudos {inputs.fine_pseudo_spectra}
        --workspaces {inputs.fine_coupling_matrices}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --max-procs {resources.cpus} --out {output}
      resources:
        cpus: 2
        memory: 4Gi
        # The 1.4 GB coupling archive plus its 2.6 GB unpacked FITS.
        disk: 8Gi
        time_limit: 1h

  - id: bin_covariance_flat_controls
    type: data
    label: "Homogeneous Gaussian covariance controls"
    description: |
      256 homogeneous Gaussian flat-sky skies per projection with the matched
      radial TT, EE and BB powers, through the same field masks and the same
      pure-B unit-width estimator. They give the covariance an ordinary
      masked homogeneous sky would have, against which the projected skies'
      excess variance and band correlation are measured.
    inputs: [bin_covariance_control_spectra, flatsky_masks]
    decisions: [b_purification, ell_max]
    units:
      batch: 0..16
    recipe:
      command: >-
        bash env.sh python3 src/stages/bin_covariance_controls.py simulate
        --spectra {inputs.bin_covariance_control_spectra}
        --masks {inputs.flatsky_masks} --batch {units.batch}
        --batch-size 16
        --purify-b {decisions.b_purification} --lmax {decisions.ell_max}
        --max-procs {resources.cpus} --out {output}
      resources:
        cpus: 4
        memory: 4Gi
        disk: 4Gi
        time_limit: 1h

  # --- Inverting the response on noisy skies --------------------------------
  - id: noisy_inversion_sims
    type: data
    label: "Noisy SPT-3G-like 1500d skies"
    description: |
      260 independent lensed Gaussian skies (TT, EE, BB, TE), convolved on the
      sphere with a 1.2 arcmin Gaussian beam and passed through the
      production field projection for SFL, STG and ZEA, then observed as two
      noise splits with a coadded polarization depth of 5 uK-arcmin
      (5/sqrt(2) in temperature). The noise is white on the grid and never
      projected, at a fixed depth per unit sky area: uniform for ZEA and SFL,
      rising with STG's area magnification. The beam and depth are written
      literally in the recipe as the SPT-3G-like configuration the paper
      states. Unit-width split-cross and noise-free pseudo-spectra; no maps.
      They test the cost of inverting the response (Sect. 5).
    inputs: [flatsky_masks, theory_spectra]
    decisions: [intermediate_nside, interpolation, b_purification, ell_max]
    units:
      seed: 0..260
    recipe:
      command: >-
        bash env.sh python3 src/stages/noisy_inversion_sims.py
        --masks {inputs.flatsky_masks} --theory {inputs.theory_spectra}
        --seed {units.seed}
        --nside {decisions.intermediate_nside}
        --interpolation {decisions.interpolation}
        --purify-b {decisions.b_purification} --lmax {decisions.ell_max}
        --noise-pol 5 --beam-fwhm 1.2
        --max-procs {resources.cpus} --out {output}
      resources:
        cpus: 8
        memory: 24Gi
        disk: 4Gi
        time_limit: 6h

  # --- Controls on the pipeline's own BB floor -------------------------------
  - id: window_bandlimit_test
    type: data
    label: "Sky band-limit control for grid aliasing"
    description: |
      One realization with its alms cut to ell = 5000 before synthesis,
      otherwise through the production field pipeline, compared with the
      same seed's production map at ell_max. The difference tests the
      calculated aliasing term of the BB floor, together with the direct power
      the cut removes. The 5000 cutoff is the intervention, written literally.
    inputs: [preprocessed_alms, projected_qu, flatsky_masks, coupling_matrices]
    decisions: [intermediate_nside, interpolation, ell_max, bandpower_width, b_purification, pixel_window]
    units:
      seed: [0]
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/window_bandlimit_test.py
        --alms {inputs.preprocessed_alms}
        --production-maps {inputs.projected_qu}
        --masks {inputs.flatsky_masks}
        --workspaces {inputs.coupling_matrices}
        --projection {units.projection} --seed {units.seed}
        --nside {decisions.intermediate_nside}
        --interpolation {decisions.interpolation}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --purify-b {decisions.b_purification}
        --pixel-window {decisions.pixel_window}
        --out {output}
      resources:
        cpus: 4
        memory: 24Gi
        disk: 12Gi
        time_limit: 3h

  - id: residual_pure_e_test
    type: data
    label: "Pure-E estimator sampling control"
    description: |
      Periodic pure-E flat-sky fields, band-limited at 4000 or at ell_max, put
      through the production field mask and pure-B estimator at native
      sampling and with the field and mask products refined twice as finely.
      The B that refinement removes is the estimator's own sampling
      contamination, isolated from any spherical reprojection. The production
      workspace normalizes both samplings.
    inputs: [flatsky_masks, coupling_matrices, theory_spectra]
    decisions: [ell_max, bandpower_width, b_purification]
    units:
      seed: [0, 1, 2, 3]
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/residual_pure_e_test.py
        --masks {inputs.flatsky_masks} --workspaces {inputs.coupling_matrices}
        --theory {inputs.theory_spectra}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --purify-b {decisions.b_purification}
        --projection {units.projection} --seed {units.seed} --out {output}
      resources:
        cpus: 2
        memory: 4Gi
        disk: 3Gi
        time_limit: 1h

  - id: residual_map_upsample
    type: data
    label: "Estimator refinement on the production maps"
    description: |
      The production projected Q/U maps themselves, Fourier-interpolated to
      twice the sampling before mask multiplication and the pure-B
      derivatives, with two padded and tapered boundary controls. No sky is
      resynthesized or reprojected. The native-sampling spectra must
      reproduce production; the refined ones measure how much of the STG and
      ZEA floor is estimator sampling.
    inputs: [projected_qu, flatsky_masks, coupling_matrices]
    decisions: [ell_max, bandpower_width, b_purification]
    units:
      seed: [0, 1, 2, 3]
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/residual_map_upsample.py
        --maps {inputs.projected_qu} --masks {inputs.flatsky_masks}
        --workspaces {inputs.coupling_matrices}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --purify-b {decisions.b_purification}
        --projection {units.projection} --seed {units.seed} --out {output}
      resources:
        cpus: 2
        memory: 4Gi
        disk: 4Gi
        time_limit: 1h

  - id: residual_ring_test
    type: data
    label: "Synthesis-grid and subsample control"
    description: |
      The production E alms synthesized at Nside 4096 and projected with 8x
      or 16x subsampling onto the same field pixels, against the production
      map as the reference. Nside 4096 and the subsample factors are the
      interventions, written literally. Doubling the samples per pixel at
      fixed synthesis grid changes B where a coherent window cannot, which
      separates incoherent interpolation and averaging B from a window.
    inputs: [preprocessed_alms, projected_qu, flatsky_masks, coupling_matrices]
    decisions: [ell_max, bandpower_width, b_purification]
    units:
      seed: [0, 1]
      projection: [ProjSTG, ProjZEA]
    recipe:
      command: >-
        bash env.sh python3 src/stages/residual_ring_test.py
        --alms {inputs.preprocessed_alms} --maps {inputs.projected_qu}
        --masks {inputs.flatsky_masks} --workspaces {inputs.coupling_matrices}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --purify-b {decisions.b_purification}
        --projection {units.projection} --seed {units.seed} --out {output}
      resources:
        cpus: 2
        memory: 8Gi
        disk: 6Gi
        time_limit: 1h

  # --- Correcting: the masked E-mode template -------------------------------
  - id: masked_template
    type: data
    label: "Masked noisy E-mode template on SFL"
    description: |
      The leaked-B template built from E estimated on the masked, noisy 1500d
      field, for the 20 SFL skies reflattened by the polar angle. Pure-E
      estimates from two masks (the analysis mask and a 0.5 deg taper inside
      it) and a pseudo-E are compared with an oracle that takes E before
      masking, noise-free and, Wiener-filtered, with two noise splits of
      5 uK-arcmin in Q/U each (written literally: the paper's nominal depth). B spectra use
      the purified estimator. The template's field mask is its own separable
      2.5 deg taper of the 1500d box, and its geometry also covers the 5%
      disk, read from flatsky_masks.
    inputs: [projected_qu, flatsky_masks, theory_spectra]
    decisions: [ell_max, bandpower_width, b_purification]
    units:
      seed: 0..20
      projection: [ProjSFL]
    recipe:
      command: >-
        bash env.sh python3 src/stages/masked_template.py
        --maps {inputs.projected_qu} --masks {inputs.flatsky_masks}
        --theory {inputs.theory_spectra}
        --lmax {decisions.ell_max} --delta-ell {decisions.bandpower_width}
        --purify-b {decisions.b_purification}
        --noise 5
        --seed {units.seed} --out {output}
      resources:
        cpus: 4
        memory: 16Gi
        disk: 24Gi
        time_limit: 3h

  # --- Corollaries: lensing reconstruction ------------------------------------
  - id: lensing_qe_sims
    type: data
    label: "TT quadratic-estimator mean fields and grid-lens response"
    description: |
      Isotropic spherical Gaussian TT skies projected onto the four paper
      grids under the apodized 1500d field mask, through a noise-free TT
      quadratic estimator with legs 300 <= ell <= 1200, against flat Gaussian
      skies on the same mask. A fixed gradient and curl potential on each
      analysis grid is injected before projection by sampling the sphere at
      the displaced direction, paired with its sign flip. These measure the
      projection's mean field and the estimator's response to a grid lens.
      Nside 2048, 4 arcmin pixels and a sky band limit of 4000 are written
      literally: the estimator's legs end at 1200, so the production
      resolution would only add cost.
    inputs: [theory_spectra]
    decisions: [apodization]
    units:
      seed: 0..20
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/lensing_qe_sims.py
        --seed {units.seed} --projection {units.projection}
        --theory {inputs.theory_spectra}
        --apodization {decisions.apodization}
        --nside 2048 --sky-lmax 4000 --res-arcmin 4
        --lmin 300 --lmax 1200 --out {output}
      resources:
        cpus: 4
        memory: 8Gi
        disk: 4Gi
        time_limit: 1h

  - id: lensing_qe_resolution
    type: data
    label: "Quadratic-estimator resolution control"
    description: |
      Four skies per projection at Nside 4096 and 2 arcmin pixels with the
      same sky band limit, estimator legs, injected lens and flat control as
      lensing_qe_sims (the 4 arcmin Fourier coefficients are embedded on the
      finer grid). The shift in the grid-lens response tests interpolation
      and grid sampling together.
    inputs: [theory_spectra]
    decisions: [apodization]
    units:
      seed: 0..4
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/lensing_qe_resolution.py
        --seed {units.seed} --projection {units.projection}
        --theory {inputs.theory_spectra}
        --apodization {decisions.apodization}
        --nside 4096 --sky-lmax 4000 --res-arcmin 2
        --lmin 300 --lmax 1200 --out {output}
      resources:
        cpus: 4
        memory: 12Gi
        disk: 4Gi
        time_limit: 1h

  - id: lensing_qe_sky_response
    type: data
    label: "Quadratic-estimator response to lenses shared on the sphere"
    description: |
      Four pairs of a spherical TT sky and a smooth scalar lensing potential,
      shared across all four projections. The analytic gradient and curl
      deflections are applied through the sphere's exponential map before
      projection; flat controls use the same displacement projected to each
      chart. The potential varies with seed and is a response probe, not a
      cosmological lensing realization. Resolution as lensing_qe_sims.
    inputs: [theory_spectra]
    decisions: [apodization]
    units:
      seed: 0..4
      projection: [ProjSFL, ProjSTG, ProjZEA, ProjBICEP]
    recipe:
      command: >-
        bash env.sh python3 src/stages/lensing_qe_sky_sims.py
        --seed {units.seed} --projection {units.projection}
        --theory {inputs.theory_spectra}
        --apodization {decisions.apodization}
        --nside 2048 --sky-lmax 4000 --res-arcmin 4
        --lmin 300 --lmax 1200 --out {output}
      resources:
        cpus: 4
        memory: 8Gi
        disk: 4Gi
        time_limit: 1h

  # --- Corollaries: beams, compact sources, pixels, beyond two-point ----------
  - id: beam_response
    type: data
    label: "Gaussian beam applied before and after reprojection"
    description: |
      A 1 arcmin Gaussian applied to seed 0's flattened SFL Q/U on the SFL
      grid, and the same Gaussian applied to that seed's alms on the sphere,
      each with its unfiltered twin, all reprojected to ZEA and STG. Ratios of
      filtered to unfiltered power, binned in multipole and mode direction on
      the 5% disk and the 1500d field, measure the anisotropic response of a
      filter applied on a sheared grid. Purified pseudo-EE and BB of the
      unfiltered baseline, the unfiltered mismatch and the differential
      filtered map are kept as well; the differential B mixes gradient and
      numerical terms and is not read as a bound. The sphere-side synthesis at Nside 4096 and the 4x
      oversampling of every reprojection are written literally: each
      filtered map is divided by an unfiltered twin made with the identical
      synthesis and reprojection, so these settings cancel in the response,
      and the lower values keep the job within 12 GiB.
    inputs: [projected_qu, preprocessed_alms, flatsky_masks]
    decisions: [b_purification]
    units:
      seed: [0]
    recipe:
      command: >-
        bash env.sh python3 src/stages/beam_reprojection.py
        --qu-maps {inputs.projected_qu} --alms {inputs.preprocessed_alms}
        --masks {inputs.flatsky_masks} --seed {units.seed}
        --purify-b {decisions.b_purification}
        --fwhm 1 --nside 4096 --rebin 4 --max-procs 2
        --out {output}
      resources:
        cpus: 2
        memory: 12Gi
        disk: 8Gi
        time_limit: 2h

  - id: local_source_geometry
    type: data
    label: "Compact-source matched-filter geometry"
    description: |
      The local response of an isotropic matched filter to a compact source
      on each projection, at 15 positions on the 1500d field for SFL, ZEA and
      BICEP: recovered amplitude for Gaussian point sources and beta-model
      cluster proxies with a 1.2 arcmin beam, in white noise and in CMB plus
      18 uK-arcmin white noise, with the exact linear-estimator variance from
      the local projected covariance and the local-metric and magnification
      corrected templates. Analytic per position, with a small Monte Carlo
      check at one.
    inputs: [theory_spectra]
    recipe:
      command: >-
        mkdir -p {output} &&
        bash env.sh python3 analysis/local_measurements.py
        --theory {inputs.theory_spectra} --out {output}/geometry.json
      resources:
        cpus: 1
        memory: 2Gi
        disk: 1Gi
        time_limit: 1h

  - id: local_source_sims
    type: data
    label: "Compact sources injected on CMB skies"
    description: |
      Point sources and cluster proxies evaluated analytically on the sphere
      (not pixelized) at 15 positions of the 1500d field, added to a common
      beam-smoothed spherical CMB band-limited at ell_max and 18 uK-arcmin
      noise, then matched-filtered on SFL, ZEA and BICEP. 64 skies. The CMB
      is synthesized at Nside 2048, written literally: only the background
      CMB is pixelized, and local_source_resolution repeats the suite at
      Nside 4096 and 8192 to show the result has converged in that
      sampling.
    inputs: [theory_spectra]
    decisions: [ell_max]
    units:
      seed: 0..64
    recipe:
      command: >-
        bash env.sh python3 src/stages/local_source_sims.py
        --seed {units.seed} --nside 2048
        --theory {inputs.theory_spectra} --lmax {decisions.ell_max}
        --out {output}
      resources:
        cpus: 2
        memory: 4Gi
        disk: 2Gi
        time_limit: 2h

  - id: local_source_resolution
    type: data
    label: "Compact-source CMB resolution control"
    description: |
      local_source_sims repeated for 16 seeds with the CMB background
      synthesized at Nside 4096 and 8192, sources and noise unchanged, to
      show the matched-filter significance has converged in the CMB's
      HEALPix sampling.
    inputs: [theory_spectra]
    decisions: [ell_max]
    units:
      nside: [4096, 8192]
      seed: 0..16
    recipe:
      command: >-
        bash env.sh python3 src/stages/local_source_resolution.py
        --seed {units.seed} --nside {units.nside}
        --theory {inputs.theory_spectra} --lmax {decisions.ell_max}
        --out {output}
      resources:
        cpus: 2
        memory: 4Gi
        disk: 2Gi
        time_limit: 2h
        per_unit:
          - when: {nside: 8192}
            memory: 8Gi

  - id: spherical_grid_test
    type: data
    label: "Spherical HEALPix and CAR pixel tests"
    description: |
      White zero-B skies band-limited at ell = 256 on HEALPix (Nside 128 and
      256) and on a CAR grid of comparable spacing, reconstructed with
      spherical transforms from pixel-centre samples and from explicit 4x4
      or 8x8 subpixel averages, with and without parallel transport, and read
      out on the full sky, four declination bands and the apodized 1500d
      footprint. Measures the B a finite pixel makes in an analysis with no
      projection. Low-resolution, fixed-band tests, written literally; they
      bound neither a cut-sky analysis nor a production grid.
    decisions: [apodization]
    units:
      nside: [128, 256]
      factor: [4, 8]
      seed: [0, 1, 2]
    recipe:
      command: >-
        bash env.sh python3 src/stages/spherical_grid_test.py
        --nside {units.nside} --factor {units.factor} --seed {units.seed}
        --lmax 256 --apodization {decisions.apodization} --out {output}
      resources:
        cpus: 2
        memory: 8Gi
        disk: 2Gi
        time_limit: 2h

  - id: spherical_grid_alias_test
    type: data
    label: "Out-of-band injection into the spherical pixel tests"
    description: |
      The same zero-B skies with power extended past ell = 256 to 384, 512,
      640 or 768, reconstructed to 256 on HEALPix Nside 128 and the 384 x 768
      CAR grid, against the same alms cut to 256 before synthesis. The
      difference isolates the out-of-band response: aliasing for point
      samples, plus finite-pixel mode coupling for averages.
    decisions: [apodization]
    units:
      input_lmax: [384, 512, 640, 768]
      seed: [0, 1, 2]
    recipe:
      command: >-
        bash env.sh python3 src/stages/spherical_grid_alias_test.py
        --input-lmax {units.input_lmax} --seed {units.seed}
        --apodization {decisions.apodization} --out {output}
      resources:
        cpus: 2
        memory: 8Gi
        disk: 2Gi
        time_limit: 2h

  - id: beyond_two_point
    type: data
    label: "Lognormal filtering control: sphere against plane"
    description: |
      24 signal-only isotropic lognormal scalar skies, smoothed by a Gaussian
      of the same central width (0.5 deg) on the sphere and on the plane, on
      sky disks 14.6, 30 and 60 deg across in the gnomonic (TAN), STG and ZEA
      projections. Third moments, peak counts and a difference-of-Gaussians
      wavelet norm compare the two. A filtering control, not a survey
      forecast; its own Nside 512 and 0.1 deg pixels are unrelated to the CMB
      pipeline.
    units:
      seed: 0..24
    recipe:
      command: >-
        bash env.sh python3 src/stages/beyond_two_point.py
        --seed {units.seed} --out {output}
      resources:
        cpus: 2
        memory: 4Gi
        disk: 1Gi
        time_limit: 1h

  - id: beyond_two_point_resolution
    type: data
    label: "Lognormal filtering resolution control"
    description: |
      Four of the lognormal skies with the HEALPix sampling, the planar
      sampling or both doubled, at the same physical smoothing scales and sky
      disks, to show the sphere-plane differences are not sampling.
    units:
      seed: [0, 1, 2, 3]
      resolution: [sphere, plane, both]
    recipe:
      command: >-
        bash env.sh python3 src/stages/beyond_two_point_resolution.py
        --seed {units.seed} --resolution {units.resolution} --out {output}
      resources:
        cpus: 2
        memory: 8Gi
        disk: 1Gi
        time_limit: 1h

  - id: beyond_two_point_calibrated
    type: data
    label: "Lognormal filtering with the mean angular scale matched"
    description: |
      The 24 skies of beyond_two_point with each planar Gaussian widened by
      exp(mean(log mu)/2) to match its mean angular scale on the sky, a
      correction that needs only the geometry. Local magnification variation
      and shear are not removed.
    units:
      seed: 0..24
    recipe:
      command: >-
        bash env.sh python3 src/stages/beyond_two_point.py
        --seed {units.seed} --mean-scale-calibration --out {output}
      resources:
        cpus: 2
        memory: 4Gi
        disk: 1Gi
        time_limit: 1h

  - id: beyond_two_point_calibrated_resolution
    type: data
    label: "Scale-matched lognormal filtering resolution control"
    description: |
      Four of the scale-matched skies at doubled sampling (Nside 1024, 0.05
      deg pixels), checking the calibrated comparison has converged.
    units:
      seed: [0, 1, 2, 3]
    recipe:
      command: >-
        bash env.sh python3 src/stages/beyond_two_point.py
        --seed {units.seed} --nside 1024 --pixel-deg 0.05
        --mean-scale-calibration --out {output}
      resources:
        cpus: 2
        memory: 8Gi
        disk: 1Gi
        time_limit: 1h

# ---------------------------------------------------------------------------
# DECISIONS
# ---------------------------------------------------------------------------
decisions:
  intermediate_nside:
    label: "Intermediate HEALPix synthesis resolution"
    tags: [resolution]
    rationale: |
      The band-limited alms are synthesized back onto a HEALPix grid, and
      that grid is bilinearly interpolated, with oversampling, onto the
      flat-sky pixels; the masks are built on the same grid so that mask and
      map share a pixelization before projection. The harmonic content is
      fixed by ell_max, so what this choice sets is how finely the field is
      sampled where the interpolation reads it. Interpolating between HEALPix
      rings adds a window in the sky frame and an incoherent B that no window
      removes: at Nside 4096, doubling the subsamples per flat pixel lowers
      STG's BB/EE by 32% while EE moves by 0.7%. Nside 8192 matches the input
      maps, so the sky is resynthesized on the grid it was drawn on, and it
      halves the ring spacing. It costs four times the memory of Nside 4096
      (6.4 GB per dense map).
    default: nside8192
    options:
      nside8192:
        label: "Nside 8192, the input resolution"
        description: "Synthesis on the input maps' own grid; the finest sampling for the interpolation."
      nside4096:
        label: "Nside 4096"
        description: "A quarter of the memory; coarser ring spacing, so a larger interpolation window and more incoherent B."

  ell_max:
    label: "Simulation band limit"
    tags: [resolution]
    rationale: |
      The alms are truncated at ell_max, which is both the sky's band limit
      and the top of the bandpowers. The 2 arcmin grid's Nyquist multipole
      along each axis is 5400, so a band limit of 6000 aliases power down to
      2 x 5400 - 6000 = 4800 for a unit Jacobian; band means are compared up
      to 4000 and spectra plotted up to 4800, which reaches the damping tail
      where the shear's distortion of EE is largest (SFL's EE near ell = 4000).
      A band limit of 4000 would stay clear of aliasing but stop short of
      that range. ell_max 6000 is lossless at the input Nside of 8192. The
      cost is in the transforms: one iter-0 map2alm at Nside 8192 takes 131 s
      at ell_max 4000 and 243 s at 6000, and the coupling-matrix build grows
      with it.
    default: l6000
    options:
      l6000:
        label: "ell_max 6000"
        description: "Reaches the damping tail; aliasing enters above ell = 4800."
      l4000:
        label: "ell_max 4000"
        description: "Below the grid's Nyquist multipole, so no aliasing, but no measurement above ell = 4000."

  bandpower_width:
    label: "Bandpower bin width"
    tags: [resolution]
    rationale: |
      Uniform linear bins, flat-weighted, from ell = 0 to ell_max. CMB
      analyses bin linearly and coarser than the mask's coupling kernel:
      SPT-3G D1 uses a uniform width of 50 (arXiv:2506.20707), ACT DR6 a
      minimum width of 50 (arXiv:2503.14452), Planck's plik 30, and BICEP2
      reports bands about 35 wide by its own convention, with neighbouring
      bands up to ~10% correlated (arXiv:1403.3985). Logarithmic
      bins at low ell fall below the kernel width and correlate neighbouring
      bandpowers. For the smallest apodized disk the azimuthally averaged
      |FFT|^2 of the mask falls below 1% of its peak by ell ~ 20 and 0.1% by
      ell ~ 45, so width 50 exceeds every mask's kernel. It also merges 2:1
      into the width-100 bands used to compare band correlations with
      SPT-3G. The coupling-matrix cost does not depend on the bin width
      (15-26 h on 8 cores for the 5% disk at widths 10 and 50 alike): it is
      set by the mask's Fourier grid, so the width is a convention, not a
      cost.
    default: d50
    options:
      d50:
        label: "Width 50"
        description: "Wider than every mask's coupling kernel; the SPT-3G convention."
      d10:
        label: "Width 10"
        description: "Resolves finer structure in ell; narrower than the kernel of the small masks, so neighbouring bands correlate."

  interpolation:
    label: "HEALPix to flat-sky resampling"
    tags: [systematics]
    rationale: |
      How map values move from the HEALPix grid to the flat-sky pixels.
      Bilinear interpolation onto a grid oversampled 8x per axis, then
      averaged 8 x 8 down to the 2 arcmin pixel, approximates the pixel
      integral of the band-limited sky. Interpolation and averaging each add a
      window, the first in the sky frame and the second in the map frame, so
      their product depends on the projection, the spin and the mode
      direction; the analysis computes it from each Jacobian and the known
      input spectrum and divides it out, and plane waves through the actual
      projector match that calculation to 0.025%. Nearest-neighbour sampling
      leaves pixelization noise that is anisotropic on the flat grid and can
      masquerade as leakage, and interpolation without oversampling leaves
      the pixel as a point sample.
    default: interp_rebin8
    options:
      interp_rebin8:
        label: "Bilinear, oversampled 8x and averaged"
        description: "Approximates the pixel integral; its window is computed and divided out."
      interp_rebin1:
        label: "Bilinear, no oversampling"
        description: "Point samples of the interpolated field; isolates what the averaging contributes."
      nearest:
        label: "Nearest neighbour"
        description: "No interpolation; the bare pixelization floor."

  apodization:
    label: "Mask apodization"
    tags: [masking]
    rationale: |
      Every footprint mask, and the 1500d field mask that the lensing and
      spherical-grid suites build for themselves, is tapered with NaMaster's
      C2 kernel over 2.5 deg. The pure-B estimator takes derivatives of the
      mask, so the taper must be smooth; a sharp edge also rings in Fourier
      space and mixes power across the coupling kernel. A wider taper
      suppresses this at the cost of sky area, and the masks' index records
      the realized sky fraction for that reason. 2.5 deg is a quarter of the
      smallest disk's 10 deg radius, so even that footprint keeps an
      untapered core.
    default: c2_2p5deg
    options:
      c2_2p5deg:
        label: "C2, 2.5 deg"
        description: "Smooth to first derivative; the taper of every mask in the paper."
      c1_2p5deg:
        label: "C1, 2.5 deg"
        description: "Same width, a kernel with a kinked derivative; separates kernel shape from width."
      c2_5deg:
        label: "C2, 5 deg"
        description: "Twice the width; less edge ringing, less usable sky."

  b_purification:
    label: "B-mode purification"
    tags: [estimator]
    rationale: |
      On a cut sky the standard pseudo-C_ell estimator mixes E into B through
      the mask's boundary, by an amount that depends on the mask rather than
      the projection. The pure-B estimator removes the ambiguous modes there,
      so the BB that remains measures what the projection leaks: STG, which
      does not shear, then shows only the pipeline's own floor. Flattened Q
      and U enter NaMaster as a purified spin-two field, and every simulation
      suite that measures B uses the same estimator.
    default: purify
    options:
      purify:
        label: "Pure-B estimator"
        description: "Removes the mask's ambiguous modes, so residual BB is projection leakage."
      standard:
        label: "Standard pseudo-C_ell"
        description: "No purification; shows how much mask-induced mixing purification removes."

  pixel_window:
    label: "Pixel-window correction"
    tags: [systematics]
    rationale: |
      The input maps carry no HEALPix pixel window: the C_ell of their alms
      matches theory flat to ell = 6000, incompatible with an Nside-8192
      pixwin^2 at more than 50 sigma, because they were synthesized in
      harmonic space without pixel smoothing. The window the flat maps do
      carry is that of the 2 arcmin flat-sky pixel, a top-hat average whose
      transfer function is averaged over each annulus, since NaMaster bins in
      annuli; the bandpowers are divided by it. The further window of
      interpolation and averaging depends on projection and spin and is
      corrected separately (see interpolation). Dividing by a HEALPix window
      the maps do not carry would over-correct.
    default: flat_only
    options:
      flat_only:
        label: "Flat-sky pixel window"
        description: "Divide by the 2 arcmin top-hat window, the one the maps carry."
      none:
        label: "No correction"
        description: "Spectra roll off at high ell with the flat-sky window."
      healpix_only:
        label: "Input HEALPix window"
        description: "Divide by hp.pixwin at Nside 8192; over-corrects, since the inputs carry no such window."
      healpix_and_flat:
        label: "Input HEALPix and flat-sky windows"
        description: "Both windows; over-corrects for the same reason."
