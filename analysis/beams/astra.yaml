version: "0.0.12"
id: beam_reprojection
name: Gaussian filtering before and after reprojection
inputs:
  - id: source_qu
    type: data
    source: ../../results/highell/projected_qu/qu_ProjSFL_seed0000.g3
  - id: source_alms
    type: data
    source: ../../results/highell/preprocessed_alms/alms_seed0000.fits
  - id: script
    type: code
    source: ../../src/stages/beam_reprojection.py
  - id: disk_zea
    type: data
    source: ../../results/highell/flatsky_masks/mask_ProjZEA_5.npz
  - id: disk_stg
    type: data
    source: ../../results/highell/flatsky_masks/mask_ProjSTG_5.npz
  - id: field_zea
    type: data
    source: ../../results/highell/field_flatsky_masks/mask_ProjZEA_0.npz
  - id: field_stg
    type: data
    source: ../../results/highell/field_flatsky_masks/mask_ProjSTG_0.npz
outputs:
  - id: beam_response
    type: data
    label: Paired SFL and spherical Gaussian responses on ZEA and STG
    inputs: [source_qu, source_alms, script, disk_zea, disk_stg, field_zea, field_stg]
    recipe:
      command: >-
        bash ../../env.sh python3 {inputs.script}
        --qu {inputs.source_qu} --alms {inputs.source_alms}
        --disk-masks ../../results/highell/flatsky_masks
        --field-masks ../../results/highell/field_flatsky_masks
        --fwhm 1 --nside 4096 --rebin 4 --max-procs 2
        --out {output}
      resources:
        cpus: 2
        memory: 12Gi
        time_limit: 2h
